<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Shooter por turnos para estudiar Microbiología: zombies-bacteria y hongos contra un arsenal de antibióticos.">
<meta property="og:title" content="Guardia Z">
<meta property="og:description" content="Estudiá microbiología jugando: cada paciente zombie es un bicho y tus armas son los antibióticos.">
<meta name="theme-color" content="#0d1113">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1113'/%3E%3Crect x='6' y='2' width='4' height='12' fill='%23e8e3d6'/%3E%3Crect x='7' y='0' width='2' height='3' fill='%23e8e3d6'/%3E%3Crect x='7' y='5' width='2' height='7' fill='%23ff5148'/%3E%3C/svg%3E">
<title>Guardia Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: pasillo en primera persona arriba, consola de guardia (diálogo + arsenal) abajo o a la derecha en desktop. Look único oscuro, deliberado. */
:root{
  --bg:#0d1113; --panel:#151b1e; --panel2:#1c2428; --line:#2c383d;
  --fg:#e8e3d6; --mute:#8f9c99; --accent:#ffb02e; --danger:#ff5148; --ok:#5ee38f;
  --gpos:#8b5cf6; --gneg:#ec4899;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){#app{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--mute)}
.topbar b{color:var(--accent);font-weight:600}
.topbar .sp{flex:1}
.screen{position:relative;border:2px solid var(--line);background:#000;line-height:0}
canvas{width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;display:block}
.plate{position:absolute;left:10px;top:10px;line-height:1.2;background:rgba(10,14,16,.82);border:2px solid var(--line);padding:6px 10px 8px;min-width:min(240px,60%);max-width:70%}
.pname{font-family:var(--f-display);font-size:16px;letter-spacing:.03em}
.pname.unk{color:var(--mute)}
.bar{height:8px;background:#2a1517;margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--danger);transition:width .35s}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.chip{padding:1px 6px;border:1px solid var(--line);background:var(--panel)}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;background:var(--panel);border:2px solid var(--line);padding:10px 12px}
.hud label{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hud .val{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.hud .bar{height:10px;margin-top:4px}
#hpbar i{background:var(--ok)}
#prbar{background:#2a2412} #prbar i{background:var(--accent)}
.good{color:var(--ok)} .bad{color:var(--danger)} .mute{color:var(--mute)}
/* Consola: registro de la partida + historia clínica, siempre visibles */
.console{display:grid;gap:14px;grid-template-columns:1fr;min-width:0}
@media (min-width:980px){.console{grid-column:1/-1;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.pane{background:#0a0d0e;border:3px double var(--fg);display:grid;grid-template-rows:auto 1fr;position:relative;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:2px solid var(--line)}
.phead h2{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--accent);font-weight:600}
.hcn{font-family:var(--f-display);font-size:12px;color:var(--mute);letter-spacing:.04em}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.flt{background:none;border:1px solid var(--line);padding:2px 8px;font-size:12px;font-family:var(--f-display);letter-spacing:.05em;color:var(--mute)}
.flt[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:#2a2110}
.log,.hc{height:300px;overflow-y:auto;padding:8px 12px 12px;display:grid;gap:7px;align-content:start;font-size:14px;overscroll-behavior:contain}
.log b,.hc b{color:var(--accent);font-weight:600}
.log b.good,.log b.bad{color:inherit}
.ln{display:grid;grid-template-columns:84px 1fr;gap:9px;align-items:baseline;max-width:84ch}
.tg{font-family:var(--f-display);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:0 4px;border:1px solid currentColor;text-align:center;white-space:nowrap;color:var(--mute)}
.t-sint .tg{color:var(--accent)} .t-int .tg,.t-ex .tg,.t-lab .tg{color:#4cc3f0} .t-atk .tg{color:#ff7a6b} .t-hint .tg{color:#c4b5fd}
.t-best .tg,.t-dx .tg{color:var(--ok)} .t-ok .tg{color:var(--fg)} .t-res .tg,.t-dxbad .tg,.t-warn .tg{color:var(--danger)}
.t-info{color:var(--mute);font-size:13px}
.sep{font-family:var(--f-display);font-size:13px;letter-spacing:.05em;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.sep:first-child{border-top:0;margin-top:0;padding-top:0}
.log[data-f="p"]>:not(.g-p):not(.sep),.log[data-f="d"]>:not(.g-d):not(.sep),.log[data-f="e"]>:not(.g-e):not(.sep){display:none}
.log.static{height:auto;max-height:none;padding:8px 0;overflow:visible}
.tolast{position:absolute;right:14px;bottom:12px;background:var(--accent);color:#1a1205;border:0;padding:4px 10px;font-family:var(--f-display);font-size:12px;letter-spacing:.05em}
.hcg h3{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#4cc3f0;margin:0 0 3px;font-weight:400}
.hcg h3 span{color:var(--mute)}
.hcg p{margin:0}
.hcg ul{margin:0;padding-left:16px;display:grid;gap:3px}
.hcg .mute{font-size:13px}
.hcg.dxok h3{color:var(--ok)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act.sm{padding:6px;font-size:12.5px}
.actions .act.sm:nth-child(5){grid-column:1/2}
.actions .act.sm:nth-child(7){grid-column:3/5}
.act{min-width:0;overflow-wrap:anywhere;background:var(--panel2);border:2px solid var(--line);padding:10px 4px;font-family:var(--f-display);font-size:clamp(12px,1.15vw,14px);letter-spacing:.03em;text-transform:uppercase;display:grid;gap:2px;justify-items:center}
.act small{font-family:var(--f-body);font-size:11px;color:var(--mute);letter-spacing:0;text-transform:none}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.4;cursor:not-allowed}
.arsenal{background:var(--panel);border:2px solid var(--line)}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--line)}
.tab{flex:1 0 auto;background:none;border:0;padding:9px 10px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab .sq{width:8px;height:8px;display:inline-block}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--tc)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px}
.wpn{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;align-items:start}
.wpn:hover:not(:disabled){border-color:var(--tc)}
.wpn:disabled{opacity:.35;cursor:not-allowed}
.wpn .ic{grid-row:span 2;width:12px;height:22px;margin-top:3px;background:var(--tc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.35)}
.wpn .nm{font-weight:600;font-size:14px;line-height:1.2}
.wpn .mc{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.3}
.wpn .key{font-family:var(--f-display);font-size:11px;color:var(--mute)}
.wpn .am{font-family:var(--f-display);font-size:11px;color:var(--accent)}
.wcell{position:relative;display:grid}
.wcell .wpn{padding-right:32px}
.winfo{position:absolute;right:6px;bottom:6px;width:22px;height:22px;padding:0;background:var(--panel);border:1px solid var(--line);font-family:var(--f-display);font-size:13px;line-height:1;color:var(--mute)}
.winfo:hover{border-color:var(--tc);color:var(--fg)}
.overlay{position:fixed;inset:0;background:rgba(5,7,8,.86);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.box{background:var(--panel);border:3px double var(--fg);max-width:640px;width:100%;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 32px);overflow-y:auto}
.box h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.02em}
.box h3{font-family:var(--f-display);font-size:14px;margin:0;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,11vw,84px);line-height:.9;letter-spacing:.02em;color:var(--fg);text-shadow:4px 4px 0 #6b0f0f}
.logo span{color:var(--danger);text-shadow:4px 4px 0 #3a0606}
.lead{color:var(--mute);margin:0;max-width:56ch}
.btns{display:grid;gap:8px}
.btn{background:var(--panel2);border:2px solid var(--line);padding:11px 14px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.btn:hover{border-color:var(--accent)}
.btn.main{border-color:var(--accent);background:#2a2110}
.btn .t{font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.btn .s{font-size:12.5px;color:var(--mute);text-align:right}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.how{font-size:13.5px;color:var(--mute);display:grid;gap:4px;margin:0;padding-left:18px}
.how b{color:var(--fg);font-weight:600}
.ficha{display:grid;gap:10px}
.ficha dl{margin:0;display:grid;gap:9px}
.ficha dt{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ficha dd{margin:2px 0 0}
.ficha .trap{border:2px dashed var(--danger);padding:8px 10px}
.ficha .trap dt{color:var(--danger)}
.stainrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.dot{width:12px;height:12px;display:inline-block;border:1px solid rgba(255,255,255,.3)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bcard{background:var(--panel2);border:2px solid var(--line);padding:8px;text-align:left;display:grid;gap:3px;font-size:13px;line-height:1.25}
.bcard.unseen{color:var(--mute);cursor:default}
.bcard .bn{font-weight:600}
.bcard .bs{font-size:11px;color:var(--mute);font-family:var(--f-display);letter-spacing:.06em}
.dgrid{display:grid;gap:8px}
.statline{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-display);font-size:14px;letter-spacing:.04em}
.statline b{color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.box.wide{max-width:880px}
.rep{border:2px solid var(--line);background:var(--panel2);padding:12px 14px;display:grid;gap:8px}
.rep header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rep header h2{font-size:20px;flex:1 1 auto}
.rep header small{font-size:12px;color:var(--danger);letter-spacing:.08em;text-transform:uppercase}
.rw{font-family:var(--f-display);font-size:12px;color:var(--mute);letter-spacing:.05em;flex-basis:100%}
.ro{font-family:var(--f-display);font-size:13px}
.rep p{margin:0}
.rep h4{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#4cc3f0;margin:0 0 2px;font-weight:400}
.rep ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.shots .tg{margin:0 4px}
.shots .t-best .tg{color:var(--ok)} .shots .t-res .tg{color:var(--danger)}
.rep summary,.repd summary{cursor:pointer;font-family:var(--f-display);letter-spacing:.05em;color:var(--accent)}
.rep details .ficha{margin-top:8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:520px){.actions{grid-template-columns:repeat(2,1fr)}.plate{min-width:0;max-width:78%;padding:4px 8px 6px}.pname{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div class="topbar"><b id="floorLbl">Guardia Z</b><span id="roomLbl"></span><span class="sp"></span><span id="xpLbl">XP 0</span></div>
    <div class="screen">
      <canvas id="cv" width="320" height="180" aria-label="Pasillo del hospital con el paciente zombie"></canvas>
      <div class="plate" id="plate" hidden>
        <div class="pname unk" id="pname">???</div>
        <div class="bar"><i id="ehp" style="width:100%"></i></div>
        <div class="ptags" id="ptags"></div>
      </div>
    </div>
    <div class="hud">
      <div><label>Salud</label><div class="val" id="hpVal">100</div><div class="bar" id="hpbar"><i style="width:100%"></i></div></div>
      <div><label>Presión de selección</label><div class="val" id="prVal">0%</div><div class="bar" id="prbar"><i style="width:0%"></i></div></div>
      <div><label>Reserva hospitalaria</label><div class="val" id="ammoVal" style="font-size:14px;line-height:1.5"></div></div>
    </div>
  </div>
  <div class="col">
    <div class="actions">
      <button class="act" id="bAsk">Interrogar<small>historia · I</small></button>
      <button class="act" id="bExam">Examinar<small>semiología · E</small></button>
      <button class="act" id="bScan">Escanear<small>laboratorio · S</small></button>
      <button class="act" id="bDiag">Diagnosticar<small>×1,3 a ×1,6 · D</small></button>
      <button class="act sm" id="bHint">Pista<small>residente · P</small></button>
      <button class="act sm" id="bRep">Repaso<small>la partida · R</small></button>
      <button class="act sm" id="bBest">Bestiario<small>y arsenal · B</small></button>
    </div>
    <div class="arsenal">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="wgrid" id="wgrid"></div>
    </div>
  </div>
  <div class="console">
    <section class="pane" aria-label="Registro de la partida">
      <div class="phead"><h2>Registro</h2>
        <div class="filters" role="group" aria-label="Filtrar registro">
          <button class="flt" data-f="all" aria-pressed="true">Todo</button><button class="flt" data-f="p" aria-pressed="false">Pistas</button><button class="flt" data-f="d" aria-pressed="false">Disparos</button><button class="flt" data-f="e" aria-pressed="false">Errores</button>
        </div>
      </div>
      <div class="log" id="log" data-f="all" aria-live="polite"></div>
      <button class="tolast" id="toLast" hidden>↓ Ir al último</button>
    </section>
    <section class="pane" aria-label="Historia clínica del paciente actual">
      <div class="phead"><h2>Historia clínica</h2><span class="hcn" id="hcN"></span></div>
      <div class="hc" id="hc"></div>
    </section>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="box" id="ovbox"></div></div>

<script>
/* ============ ARSENAL ============ */
const TABS=[
 {id:'pared',n:'Pared · membrana',c:'#f5c542'},
 {id:'ribo',n:'Ribosoma',c:'#4cc3f0'},
 {id:'adn',n:'ADN · folato',c:'#a6e04a'},
 {id:'hongo',n:'Antifúngicos',c:'#38d6c0'},
 {id:'sost',n:'Sin ATB',c:'#ff7a6b'}];
const W=[
 {id:'penG',n:'Penicilina G',tab:'pared',fam:'bl',mech:'Bloquea las PBP: no se arma el peptidoglicano, lisis',
  desc:{clase:'Betalactámico · penicilina natural',mecanismo:'Se une a las PBP y frena la transpeptidación del peptidoglicano: lisis, bactericida.',cubre:'S. pyogenes, neumococo sensible, Treponema, Leptospira, clostridios, meningococo.',noCubre:'S. aureus con penicilinasa, enterobacterias, Pseudomonas, bichos sin pared o intracelulares.'}},
 {id:'amoxi',n:'Amoxicilina / Ampicilina',tab:'pared',fam:'bl',mech:'Aminopenicilina: entra mejor en algunos Gram −',
  desc:{clase:'Betalactámico · aminopenicilina',mecanismo:'Igual que la penicilina, pero atraviesa mejor las porinas de algunos Gram −.',cubre:'Estreptococos, neumococo, Enterococcus faecalis, Listeria, H. pylori (en esquema).',noCubre:'S. aureus con penicilinasa, Klebsiella (SHV-1), Pseudomonas, B. fragilis, atípicos.'}},
 {id:'amoxiclav',n:'Amoxi-clavulánico',tab:'pared',fam:'bl',mech:'Amoxi + inhibidor de β-lactamasa',press:15,
  desc:{clase:'Betalactámico + inhibidor de β-lactamasa',mecanismo:'El clavulánico se sacrifica pegándose a la β-lactamasa y deja actuar a la amoxicilina.',cubre:'Lo de la amoxicilina + SAMS, H. influenzae productor de β-lactamasa, Klebsiella, anaerobios.',noCubre:'SAMR, Pseudomonas, AmpC y carbapenemasas, atípicos.'}},
 {id:'oxa',n:'Oxacilina',tab:'pared',fam:'bl',mech:'Resiste la penicilinasa del estafilococo',
  desc:{clase:'Betalactámico · penicilina antiestafilocócica',mecanismo:'Su cadena lateral voluminosa la protege de la penicilinasa del estafilococo.',cubre:'S. aureus sensible a meticilina (SAMS) y estreptococos.',noCubre:'SAMR, Gram −, enterococo, anaerobios.'}},
 {id:'cefa1',n:'Cefazolina / Cefalexina',tab:'pared',fam:'bl',mech:'Cefalosporina 1ª: sobre todo Gram +',
  desc:{clase:'Betalactámico · cefalosporina de 1ª generación',mecanismo:'Inhibe las PBP; resiste la penicilinasa estafilocócica.',cubre:'SAMS, estreptococos, algunas E. coli en orina. Profilaxis quirúrgica.',noCubre:'SAMR, enterococo, Listeria, Pseudomonas, anaerobios. No pasa la BHE.'}},
 {id:'ceftri',n:'Ceftriaxona',tab:'pared',fam:'bl',mech:'Cefalosporina 3ª: Gram − y pasa la BHE',press:20,
  desc:{clase:'Betalactámico · cefalosporina de 3ª generación',mecanismo:'Inhibe las PBP, resiste las β-lactamasas comunes y llega bien al LCR.',cubre:'Neumococo, meningococo, gonococo, H. influenzae, enterobacterias sin BLEE, Salmonella.',noCubre:'Pseudomonas, enterococo, Listeria, SAMR, anaerobios, atípicos. Las BLEE la destruyen.'}},
 {id:'ceftaz',n:'Ceftazidima / Cefepime',tab:'pared',fam:'bl',mech:'Cefalosporina antipseudomónica',press:20,
  desc:{clase:'Betalactámico · cefalosporina antipseudomónica (3ª-4ª)',mecanismo:'Inhibe las PBP y atraviesa la membrana externa de Pseudomonas.',cubre:'Pseudomonas aeruginosa y enterobacterias; el cefepime suma Gram +.',noCubre:'SAMR, enterococo, Listeria, anaerobios, BLEE y KPC.'}},
 {id:'mero',n:'Meropenem',tab:'pared',fam:'bl',mech:'Carbapenem: resiste casi toda β-lactamasa',press:35,ammo:3,
  desc:{clase:'Betalactámico · carbapenem',mecanismo:'Inhibe las PBP y resiste casi todas las β-lactamasas, incluidas BLEE y AmpC.',cubre:'Amplísimo: enterobacterias BLEE, Pseudomonas, anaerobios, Gram +.',noCubre:'SAMR, E. faecium, atípicos y bacterias con carbapenemasa (KPC).'}},

   lab:['Gram del hisopado de la fisura: cocos Gram + en CADENAS.','Cultivo: β-hemólisis completa, catalasa −, bacitracina sensible, PYR +.','ASTO elevado. Hemocultivos negativos: el diagnóstico es clínico.']},
  clave:'Placa roja de borde NETO y sobreelevado + fisura interdigital + escalofrío previo + estreptococo β-hemolítico grupo A = erisipela',
  diferenciales:{saureus:'S. aureus da celulitis más purulenta, con abscesos y borde difuso; la erisipela de borde neto es estreptocócica.',perfri:'la gangrena gaseosa da crepitación y bullas oscuras después de una herida con tierra.',dermato:'la tiña da una placa anular con centro claro y prurito, sin fiebre.',pseudo:'el ectima gangrenoso de Pseudomonas es una úlcera necrótica en neutropénicos.'}},
 {cuadro:'Fascitis necrotizante',sint:'Grita de dolor por una pierna que apenas está roja, y la piel se le pone violeta mientras lo mirás.',
  pistas:{interrogatorio:['Hombre de 50 años, diabético.','Hace dos días se golpeó la pierna jugando al fútbol; tomó antiinflamatorios.','No hubo herida con tierra ni cirugía.','Evolución: 36 horas de dolor que no para de crecer, y ahora fiebre y mareos.'],
   examen:['Dolor DESPROPORCIONADO a lo que se ve; piel tensa, violácea, con ampollas y zonas anestesiadas.','TA 85/50, taquicardia: shock. Sin crepitación.'],
   lab:['Gram del tejido desbridado: cocos Gram + en CADENAS; no hay bacilos grandes.','Cultivo: β-hemólisis, bacitracina sensible: grupo A. Hemocultivos positivos.','CPK elevada, creatinina en ascenso: shock tóxico estreptocócico.']},
  clave:'Dolor desproporcionado + piel violácea con ampollas + shock + cocos en cadena en el desbridamiento = fascitis necrotizante por S. pyogenes',
  diferenciales:{perfri:'C. perfringens da crepitación con gas y bacilos Gram + grandes sin esporas.',saureus:'S. aureus forma racimos y es catalasa +; rara vez da fascitis.',bfrag:'las fascitis mixtas con anaerobios dan olor fétido y gas; acá hay solo cocos en cadena.',pseudo:'el ectima de Pseudomonas es una úlcera necrótica en neutropénicos, no una fascitis en un sano.'},
  best:{penG:'Penicilina en dosis altas + desbridamiento quirúrgico urgente.',clinda:'Clindamicina: frena la síntesis de proteína M y toxinas aunque haya un inóculo enorme en fase estacionaria, donde la penicilina pierde eficacia (efecto Eagle).'},
  ok:{amoxi:'Sirve como betalactámico, pero acá van dosis altas EV y el combo con clindamicina.'}},
 {cuadro:'Impétigo',sint:'Una nena con costras color miel alrededor de la nariz que se le pegan a todo.',
  pistas:{interrogatorio:['Nena de 4 años.','Es verano y tenía picaduras de mosquito que se rascó.','Dos compañeritos del jardín tienen lo mismo.','Evolución: 5 días; empezó con granitos que se volvieron costras.'],
   examen:['Costras MELICÉRICAS (color miel) perinasales y peribucales, sobre base erosionada.','Adenopatía submaxilar; sin fiebre y sin ampollas.'],
   lab:['Gram de la lesión: cocos Gram + en cadenas.','Cultivo: β-hemólisis, catalasa −, bacitracina sensible.','La ASTO casi no sube en las infecciones de piel (los lípidos cutáneos inactivan la estreptolisina O): se eleva la anti-DNasa B.']},
  clave:'Nena en verano + costras melicéricas + brote en el jardín + estreptococo grupo A con anti-DNasa B = impétigo no ampolloso',
  diferenciales:{saureus:'el impétigo AMPOLLOSO es por S. aureus (exfoliatina): ampollas, no costras melicéricas.',dermato:'la tiña corporis da anillos con borde activo y prurito, sin costras melicéricas.',difteria:'la difteria cutánea da úlceras con membrana grisácea en no vacunados.'},
  ok:{cefa1:'Cefalexina oral: muy usada porque cubre también a S. aureus, que suele acompañar.'}}]},

spneu:{c0:'Neumonía lobar',v:[
 {cuadro:'Meningitis',sint:'Rígida como una tabla, con pus saliéndole del oído.',
  pistas:{interrogatorio:['Mujer de 45 años, ESPLENECTOMIZADA tras un accidente.','Nunca recibió la vacuna antineumocócica.','Hace 3 días tuvo otitis media derecha.','Evolución: 12 horas de cefalea intensa, fiebre, vómitos y confusión.'],
   examen:['Rigidez de nuca, Kernig y Brudzinski positivos.','Otorrea purulenta derecha. Sin petequias.'],
   lab:['LCR turbio: DIPLOCOCOS Gram + lanceolados, muchos PMN, glucorraquia menor de 34, proteínas mayores de 220.','Cultivo: α-hemólisis, catalasa −, sensible a optoquina, soluble en bilis.','Antígeno capsular neumocócico en LCR +. CIM a penicilina ELEVADA (PBP alteradas).']},
  clave:'Esplenectomizada + otitis previa + meningitis aguda + diplococos Gram + lanceolados en LCR + optoquina sensible',
  diferenciales:{menin:'el meningococo es diplococo Gram − y suele venir con petequias.',hib:'H. influenzae es cocobacilo Gram − y afecta a chicos no vacunados.',listeria:'Listeria es cocobacilo Gram + en neonatos, mayores de 50 o inmunodeprimidos, y resiste las cefalosporinas.',crypto:'Cryptococcus da meningitis subaguda en VIH, con levaduras capsuladas en tinta china.'},
  best:{ceftri:'Ceftriaxona: pasa la BHE inflamada y cubre neumococo. Empírico de elección.',vanco:'Vancomicina: se suma por las cepas con PBP alteradas (CIM alta a betalactámicos) hasta tener el antibiograma.'},
  ok:{penG:'Penicilina solo si la CIM resulta baja.',amoxi:'Ampicilina sirve solo con CIM baja; con PBP alteradas no alcanza concentración útil en LCR.'},
  nul:{macro:'El macrólido es bacteriostático y casi no llega al LCR: no sirve en meningitis.'}},
 {cuadro:'Otitis media aguda',sint:'Un bebé que llora sin parar tirándose de la oreja, con un escudo brillante alrededor.',
  pistas:{interrogatorio:['Nene de 18 meses.','Va a la guardería desde los 6 meses.','Tuvo un resfrío la semana pasada.','Evolución: 2 días de fiebre e irritabilidad; se tira de la oreja derecha.'],
   examen:['Tímpano derecho rojo, ABOMBADO y sin movilidad en la otoscopía neumática.','Sin exudado amigdalino ni rash. Rinorrea mucosa.'],
   lab:['Timpanocentesis: diplococos Gram + lanceolados con PMN.','Cultivo: α-hemólisis (verde), catalasa −, sensible a optoquina.','Reacción de Quellung +: la cápsula se hincha con el antisuero específico.']},
  clave:'Guardería + resfrío previo + tímpano abombado + diplococo Gram + lanceolado optoquina sensible = otitis media por neumococo',
  diferenciales:{hib:'H. influenzae (no tipificable) también da otitis media, pero es cocobacilo Gram − que necesita factores X y V.',spyo:'S. pyogenes es β-hemolítico y sensible a bacitracina.',pseudo:'Pseudomonas da otitis EXTERNA (oído de nadador), no media con tímpano abombado.'},
  ok:{amoxiclav:'Amoxi-clavulánico si recibió amoxicilina reciente o se sospecha H. influenzae productor de β-lactamasa.',ceftri:'Ceftriaxona IM: se reserva para la otitis que no responde o el chico que no tolera la vía oral.'}}]},

entero:{c0:'ITU en anciana sondada',v:[
 {cuadro:'Endocarditis subaguda tras cistoscopía',sint:'Un anciano pálido y flaco con un fueguito en la vejiga y algo raspando en el pecho.',
  pistas:{interrogatorio:['Hombre de 72 años.','Tiene una válvula aórtica calcificada.','Hace 3 semanas le hicieron una cistoscopía con resección de próstata.','Evolución: 4 semanas de fiebre baja, cansancio y pérdida de peso.'],
   examen:['Soplo diastólico aórtico NUEVO y esplenomegalia.','Nódulos de Osler dolorosos en los pulpejos.'],
   lab:['Hemocultivos 3 de 3: cocos Gram + en pares y cadenas cortas.','Cultivo: catalasa −, crece en bilis-esculina y NaCl 6,5%, PYR +. Sin β-lactamasa.','Eco transesofágico: vegetación aórtica.']},
  clave:'Anciano + manipulación urológica + fiebre de semanas + soplo nuevo + coco Gram + catalasa − que crece en bilis-esculina = endocarditis por Enterococcus',
  diferenciales:{saureus:'S. aureus da endocarditis AGUDA, en racimos y catalasa +.',spyo:'S. pyogenes es β-hemolítico y no causa endocarditis subaguda (el resumen de la cátedra lo dice: es un error).',samr:'el SAMR es catalasa + y coagulasa +, en racimos.'},
  best:{amoxi:'Ampicilina: abre la pared del enterococo.',genta:'Gentamicina en SINERGIA: sola no entra al enterococo, pero con la pared abierta por la ampicilina llega al ribosoma. Una vegetación pide bactericida.'},
  nul:{nitro:'La nitrofurantoína solo concentra en orina: no sirve en bacteriemia ni endocarditis.'}},
 {cuadro:'Colección abdominal que no responde a cefalosporinas',sint:'Lleva una semana con ceftriaxona y el absceso de la panza sigue ardiendo.',
  pistas:{interrogatorio:['Mujer de 60 años.','Operada de una perforación de colon hace 10 días.','Recibe ceftriaxona + metronidazol desde la cirugía.','Evolución: la fiebre volvió al 5.º día pese al tratamiento.'],
   examen:['Dolor y defensa en fosa ilíaca izquierda; el drenaje sale turbio.','Herida quirúrgica sin pus superficial.'],
   lab:['Gram del drenaje: cocos Gram + en cadenas cortas, junto a algunos bacilos Gram −.','Cultivo: catalasa −, bilis-esculina +, crece en NaCl 6,5%.','Antibiograma: sensible a ampicilina; resistencia intrínseca a todas las cefalosporinas.']},
  clave:'Cirugía de colon + ceftriaxona en curso + fiebre persistente + coco Gram + catalasa − bilis-esculina + = enterococo seleccionado por cefalosporinas',
  diferenciales:{bfrag:'B. fragilis es un bacilo Gram − anaerobio, y el metronidazol que recibe ya lo cubre.',ecoli:'E. coli es bacilo Gram − y la ceftriaxona lo cubriría.',cdiff:'C. difficile da diarrea con pseudomembranas, no una colección.',saureus:'S. aureus forma racimos y es catalasa +.'}}]},

listeria:{c0:'Embarazada con queso blando',v:[
 {cuadro:'Romboencefalitis en trasplantado',sint:'Camina torcido, ve doble y arrastra una nube helada de fiambre.',
  pistas:{interrogatorio:['Hombre de 68 años, trasplantado renal, toma tacrolimus y prednisona.','Su inmunidad celular está deprimida.','Come paté y fiambre envasado que guarda semanas en la heladera.','Evolución: 2 días de fiebre y cefalea; hoy ve doble y se tambalea.'],
   examen:['Rigidez de nuca leve, parálisis del VI y VII par, ataxia (tronco encefálico).','Sin petequias.'],
   lab:['LCR: escasos bacilos cortos Gram + (casi cocobacilos); glucorraquia baja.','Cultivo: β-hemólisis estrecha, catalasa +, movilidad en paraguas a 25 °C; crece a 4 °C.','CAMP + y esculina +. Resistente a cefalosporinas.']},
  clave:'Inmunidad celular deprimida + fiambre de heladera + meningitis con pares craneales + cocobacilo Gram + catalasa + que crece en frío',
  diferenciales:{spneu:'el neumococo es diplococo Gram + lanceolado y la ceftriaxona lo cubre.',menin:'el meningococo es diplococo Gram − con petequias.',crypto:'Cryptococcus da meningitis subaguda en VIH, con tinta china +.',tbc:'la meningitis TBC es subaguda, de semanas, con linfocitos y ADA alto.'}},
 {cuadro:'Granulomatosis infantiséptica',sint:'Un recién nacido hipotónico con granitos blancos en la piel y el olor a queso de la madre.',
  pistas:{interrogatorio:['Recién nacido de 2 días, prematuro de 35 semanas.','La madre tuvo un cuadro gripal con fiebre la semana antes del parto.','La madre come quesos de campo sin pasteurizar.','Evolución: desde el nacimiento, quejido y rechazo del alimento.'],
   examen:['Dificultad respiratoria, hipotonía; líquido amniótico teñido de meconio.','Pápulas y microabscesos diseminados en piel y faringe (granulomas).'],
   lab:['Hemocultivo: bacilos cortos Gram +.','Cultivo: catalasa +, movilidad en volteretas, β-hemólisis tenue.','CAMP +. Placenta con microabscesos.']},
  clave:'Madre con síndrome gripal + prematuro + microabscesos diseminados + bacilo Gram + catalasa + móvil = listeriosis neonatal precoz',
  diferenciales:{sagal:'S. agalactiae también es CAMP +, pero es coco Gram + en cadena, catalasa − e inmóvil.',ecoli:'E. coli es bacilo Gram − lactosa +.',entero:'Enterococcus es catalasa − y no tiene movilidad.'}}]},

difteria:{c0:'Difteria faríngea',v:[
 {cuadro:'Difteria cutánea',sint:'Una úlcera en sacabocado tapada con una membrana gris en la pierna.',
  pistas:{interrogatorio:['Hombre de 40 años en situación de calle.','No recuerda haber recibido vacunas en la adultez.','Tiene una herida en la pierna que se infectó.','Evolución: 3 semanas; la úlcera no cierra y le duele poco.'],
   examen:['Úlcera redondeada en sacabocado, de bordes netos, cubierta por una membrana grisácea adherente.','Sin compromiso faríngeo ni cuello de toro.'],
   lab:['Gram: bacilos Gram + pleomórficos en empalizada y «letras chinas»; gránulos metacromáticos.','Cultivo en Tinsdale (telurito): colonias negras con halo marrón.','Prueba de Elek +: la cepa es toxigénica (gen tox del fago β).']},
  clave:'Sin refuerzos + úlcera en sacabocado con membrana gris + bacilos en letras chinas + Elek + = difteria cutánea',
  diferenciales:{spyo:'el ectima estreptocócico da una úlcera con costra, con cocos en cadena.',pseudo:'el ectima gangrenoso de Pseudomonas aparece en neutropénicos y tiene centro negro.',saureus:'S. aureus da pus y forúnculos, con cocos en racimo.'},
  best:{macro:'Eritromicina o azitromicina: erradica al bacilo y corta la transmisión.',penG:'Penicilina: igual de eficaz para erradicar la bacteria.'},
  ok:{antitox:'La antitoxina se reserva para signos sistémicos de toxina; en la forma cutánea aislada casi nunca hace falta.'}},
 {cuadro:'Miocarditis diftérica',sint:'Habla con voz nasal, el líquido le sale por la nariz y el corazón le late a destiempo.',
  pistas:{interrogatorio:['Varón de 20 años sin vacunas.','Hace 12 días tuvo una angina con una membrana gris que «se fue sola».','Nadie le dio suero ni antibióticos.','Evolución: 3 días de falta de aire y palpitaciones.'],
   examen:['Ritmo de galope e hipotensión; el ECG muestra un bloqueo AV.','Voz nasal y regurgitación de líquidos por la nariz: parálisis del velo del paladar.'],
   lab:['Restos de membrana faríngea: bacilos Gram + en letras chinas.','Cultivo en Tinsdale: colonias negras con halo; troponina elevada.','Elek +: la toxina inactiva el EF-2 por ADP-ribosilación y frena la síntesis proteica del miocardio.']},
  clave:'Angina con membrana gris hace 2 semanas + bloqueo AV + parálisis del velo + Elek + = complicaciones tóxicas de la difteria',
  diferenciales:{spyo:'la fiebre reumática da carditis semanas después de una faringitis, pero con poliartritis y sin parálisis del velo.',botu:'el botulismo da parálisis descendente simétrica tras una conserva, sin angina previa.',hib:'la epiglotitis da babeo y estridor agudo, sin membrana ni miocarditis.'}}]},

samr:{c0:'Bacteriemia por catéter en terapia',v:[
 {cuadro:'Neumonía necrotizante de la comunidad',sint:'Un rugbier gigante que tose sangre y tiene forúnculos en los muslos.',
  pistas:{interrogatorio:['Varón de 20 años, juega al rugby.','Varios compañeros del equipo tienen forúnculos.','Tuvo gripe hace una semana.','Evolución: 24 horas de fiebre alta, hemoptisis y falta de aire.'],
   examen:['Hipoxemia grave, taquicardia e hipotensión.','Forúnculos en los muslos.'],
   lab:['Esputo: cocos Gram + en RACIMOS con muchos PMN.','Cultivo: coagulasa +; cefoxitina RESISTENTE (mecA: PBP2a).','Gen de leucocidina de Panton-Valentine +. Rx: cavidades múltiples.']},
  clave:'Post-influenza + forúnculos en el equipo + hemoptisis + cavidades + S. aureus mecA + con leucocidina PV = SAMR de la comunidad',
  diferenciales:{spneu:'el neumococo es diplococo lanceolado, catalasa −, sensible a optoquina.',kleb:'Klebsiella es bacilo Gram − capsulado en alcohólicos.',saureus:'el SAMS es sensible a la cefoxitina; este tiene mecA.',tbc:'la caverna TBC es de evolución lenta, con BAAR.'},
  ok:{clinda:'Clindamicina se suma para frenar la síntesis de leucocidina PV.'}},
 {cuadro:'Forúnculos recurrentes en la familia',sint:'Toda la familia viene detrás de él, y todos tienen granos con punta de pus.',
  pistas:{interrogatorio:['Mujer de 35 años.','Es el tercer forúnculo en 4 meses; su hijo y su marido también tienen.','Comparten toallas y van al mismo gimnasio.','Evolución: 4 días; un absceso en el glúteo que creció y fluctúa.'],
   examen:['Absceso fluctuante de 4 cm con celulitis alrededor y centro necrótico.','Sin fiebre ni compromiso general.'],
   lab:['Gram del pus drenado: cocos Gram + en racimo.','Cultivo: coagulasa +, cefoxitina RESISTENTE (mecA).','Sensible a TMP-SMX, clindamicina (sin resistencia inducible en D-test) y doxiciclina.']},
  clave:'Abscesos recurrentes en convivientes + cocos en racimo coagulasa + + mecA + = SAMR de la comunidad en piel',
  diferenciales:{saureus:'el SAMS es sensible a la cefoxitina.',spyo:'S. pyogenes da erisipela o impétigo, no abscesos, y es catalasa −.',sporo:'la esporotricosis da nódulos que suben por un linfático tras una espina.'},
  best:{tmp:'Drenaje + TMP-SMX oral: elección en piel por SAMR de la comunidad.',vanco:'Vancomicina EV si hay celulitis extensa, fiebre o falla del oral.'},
  ok:{doxi:'Doxiciclina oral: alternativa en piel.',clinda:'Clindamicina: sirve si el D-test es negativo.'}}]},

ecoli:{c0:'Cistitis',v:[
 {cuadro:'Pielonefritis en embarazada',sint:'Una embarazada doblada de dolor en la cintura, temblando de fiebre.',
  pistas:{interrogatorio:['Mujer de 26 años, embarazada de 28 semanas.','En el primer trimestre tuvo una bacteriuria asintomática que no se trató.','No tiene sondas ni litiasis conocida.','Evolución: 2 días de fiebre de 39 °C, escalofríos, dolor lumbar derecho y vómitos.'],
   examen:['Puñopercusión derecha muy dolorosa.','Taquicardia, 39 °C; sin contracciones.'],
   lab:['Sedimento: piuria con CILINDROS LEUCOCITARIOS (origen renal). Gram: bacilos Gram −.','Cultivo en CLDE: más de 100.000 UFC/ml. MacConkey: lactosa +, indol +.','La cepa tiene fimbrias P (adhesina PapG), que se pegan al urotelio alto.']},
  clave:'Embarazada + bacteriuria no tratada + fiebre y dolor lumbar + cilindros leucocitarios + E. coli con fimbrias P = pielonefritis',
  diferenciales:{kleb:'Klebsiella es lactosa + pero inmóvil e indol −, con colonias muy mucosas.',entero:'Enterococcus es coco Gram + catalasa −.',sagal:'S. agalactiae coloniza a la embarazada, pero es coco Gram + en cadena.',proteus:'Proteus es lactosa −, ureasa + y alcaliniza la orina.'},
  best:{ceftri:'Ceftriaxona EV: llega al parénquima renal y es segura en el embarazo.'},
  ok:{amoxiclav:'Amoxi-clavulánico: opción si es sensible, una vez que baja la fiebre.'},
  nul:{nitro:'La nitrofurantoína solo concentra en orina: no llega al riñón. Sirve para cistitis, nunca para pielonefritis.',cipro:'Las quinolonas se evitan en el embarazo (afectan el cartílago fetal).',tmp:'El TMP-SMX se evita en el embarazo: el TMP es antifolato y la sulfa, cerca del término, desplaza la bilirrubina (kernicterus).'}},
 {cuadro:'Meningitis neonatal',sint:'Un recién nacido frío, quieto, con la fontanela tensa como un tambor.',
  pistas:{interrogatorio:['Recién nacido de 5 días, prematuro de 33 semanas.','Rotura prematura de membranas de 24 horas antes del parto.','La madre tuvo fiebre intraparto.','Evolución: rechazo del alimento, hipotermia y una convulsión.'],
   examen:['Fontanela anterior abombada, letargo e hipotonía.','Distensión abdominal leve, ictericia.'],
   lab:['LCR: bacilos Gram −, glucorraquia baja, PMN.','Cultivo: lactosa +, indol +, oxidasa −.','Antígeno capsular K1 (ácido polisiálico, parecido a tejido neural del neonato): la cápsula que la hace neurotropa.']},
  clave:'Prematuro + rotura prolongada de membranas + meningitis + bacilo Gram − lactosa + con cápsula K1 = E. coli K1',
  diferenciales:{sagal:'S. agalactiae, la primera causa de meningitis neonatal, es coco Gram + en cadena.',listeria:'Listeria es bacilo Gram + corto con movilidad.',kleb:'Klebsiella es inmóvil, indol − y de colonias muy mucosas.'},
  best:{ceftri:'Cefalosporina de 3.ª: en el neonato se usa CEFOTAXIMA (la ceftriaxona desplaza la bilirrubina), misma familia y misma llegada al LCR.'},
  ok:{genta:'Gentamicina: se usa en el esquema empírico del neonato junto a la ampicilina.'},
  nul:{nitro:'La nitrofurantoína solo concentra en orina: no sirve en meningitis.'}}]},

eceh:{c0:'Colitis hemorrágica en nene',v:[
 {cuadro:'Síndrome urémico hemolítico',sint:'Una nena pálida como la cera, hinchada, que ya no hace pis.',
  pistas:{interrogatorio:['Nena de 4 años.','Hace una semana visitó una granja educativa y tocó terneros.','Tuvo diarrea con sangre que ya mejoró; nunca tuvo fiebre.','Evolución: 2 días de palidez, edemas y orina escasa.'],
   examen:['Palidez, petequias, edema palpebral e hipertensión arterial.','Oliguria; abdomen blando.'],
   lab:['Frotis: ESQUISTOCITOS (anemia hemolítica microangiopática) y plaquetas bajas. Creatinina alta.','Coprocultivo en MacConkey-sorbitol: colonias SORBITOL − incoloras; aglutinan con antisuero O157.','PCR para stx2 +: toxina Shiga que daña el endotelio del glomérulo.']},
  clave:'Granja con terneros + diarrea con sangre sin fiebre + anemia con esquistocitos + plaquetopenia + falla renal + toxina Shiga = SUH',
  diferenciales:{shigella:'S. dysenteriae tipo 1 también puede dar SUH, pero con fiebre alta y tenesmo; es lactosa − e inmóvil.',typhi:'la fiebre tifoidea da fiebre en escalera y roséola, no SUH.',cdiff:'C. difficile aparece tras antibióticos, en internados.',menin:'la meningococcemia da púrpura y CID con fiebre alta, no esquistocitos con falla renal aislada.'}},
 {cuadro:'Brote en un geriátrico',sint:'Una abuela que deja un reguero de sangre por el pasillo del geriátrico.',
  pistas:{interrogatorio:['Mujer de 81 años, vive en un geriátrico.','Otros 6 residentes tienen diarrea con sangre desde el fin de semana.','El sábado les sirvieron ensalada de brotes crudos.','Evolución: 2 días de cólicos intensos y diarrea con sangre, sin fiebre.'],
   examen:['Abdomen doloroso en flanco y fosa ilíaca derechos; sin fiebre.','Sin petequias; diuresis conservada.'],
   lab:['Copro en fresco: hematíes, pocos leucocitos.','MacConkey-sorbitol: colonias sorbitol −; aglutinación O157:H7.','Toxina Shiga en heces por enzimoinmunoensayo.']},
  clave:'Brote por alimento crudo + diarrea con sangre SIN fiebre + sorbitol − + toxina Shiga = E. coli O157:H7',
  diferenciales:{shigella:'Shigella da fiebre alta, tenesmo y muchos leucocitos en heces.',cdiff:'C. difficile aparece tras antibióticos, con pseudomembranas.',vibrio:'el cólera da diarrea acuosa en agua de arroz, sin sangre.'}}]},

kleb:{c0:'Neumonía en alcohólico',v:[
 {cuadro:'Absceso hepático hipervirulento',sint:'Con la panza dura del lado derecho y un ojo lleno de pus.',
  pistas:{interrogatorio:['Hombre de 52 años, diabético.','Nació en Taiwán y vive en Argentina hace 10 años.','No viajó ni tuvo cirugías abdominales.','Evolución: 10 días de fiebre y dolor en hipocondrio derecho; hoy ve borroso de un ojo.'],
   examen:['Hepatomegalia dolorosa.','Ojo rojo con hipopion: endoftalmitis por siembra hematógena.'],
   lab:['Punción del absceso: bacilos Gram − con cápsula gruesa.','Cultivo: colonias MUY mucosas; prueba del hilo + (se estiran más de 5 mm): hipermucoviscosa.','Lactosa +, inmóvil, ureasa +; serotipo capsular K1.']},
  clave:'Diabético asiático + absceso hepático + endoftalmitis + Gram − capsulado con prueba del hilo + = Klebsiella hipervirulenta',
  diferenciales:{ecoli:'E. coli es móvil e indol +, y no es hipermucoviscosa.',bfrag:'un absceso por anaerobios huele fétido y el germen es pleomórfico y crece en bilis.',pseudo:'Pseudomonas es no fermentador oxidasa +.'}},
 {cuadro:'ITU por sonda con BLEE',sint:'Arrastra la bolsa de la sonda llena de orina turbia y se ríe de la ceftriaxona.',
  pistas:{interrogatorio:['Hombre de 74 años, internado hace 3 semanas.','Tiene sonda vesical desde la internación.','Recibió ceftriaxona dos veces este mes.','Evolución: 2 días de fiebre y escalofríos pese a la ceftriaxona.'],
   examen:['Orina turbia en la bolsa; dolor suprapúbico.','Sin otro foco: pulmones limpios.'],
   lab:['Gram de orina: bacilos Gram − capsulados.','Cultivo: lactosa +, inmóvil, colonias mucosas.','Antibiograma: resistente a cefalosporinas de 3.ª y 4.ª; sinergia con clavulánico (efecto huevo): BLEE. Sensible a meropenem.']},
  clave:'Internado + sonda + cefalosporinas previas + Klebsiella con efecto huevo + sensible a carbapenem = BLEE',

  best:{mero:'Meropenem: el carbapenem resiste a las BLEE. Elección en infección grave.'},
  ok:{genta:'Gentamicina: suele conservar actividad en orina.'},
  res:{ceftri:'BLEE (tipo CTX-M): hidroliza las cefalosporinas de 3.ª generación.',ceftaz:'La BLEE también hidroliza ceftazidima y cefepime.',cefa1:'La BLEE destruye las cefalosporinas de 1.ª.',amoxiclav:'El clavulánico inhibe la BLEE in vitro, pero con mucho inóculo no alcanza: no es confiable.'}}]},

pseudo:{c0:'Gran quemado',v:[

  pistas:{interrogatorio:['Hombre de 66 años, 9 días en asistencia respiratoria mecánica.','Operado de urgencia del abdomen; recibió ceftriaxona.','La neumonía aparece después de las 48 horas de internación: nosocomial tardía.','Evolución: 2 días de fiebre, más secreciones y peor oxigenación.'],
   examen:['Crepitantes en la base derecha y secreción purulenta verdosa por el tubo.','Desaturación con FiO₂ en aumento.'],
   lab:['Aspirado traqueal: más de 10⁶ UFC/ml de bacilos Gram −.','Cultivo: no fermentador, OXIDASA +, pigmento azul-verdoso (piocianina), olor a uva, crece a 42 °C.','Antibiograma: resistente a ceftriaxona, sensible a ceftazidima.']},
  clave:'ARM más de 5 días + secreción verde + no fermentador oxidasa + con piocianina = neumonía nosocomial tardía por Pseudomonas',
  diferenciales:{kpc:'la KPC es una enterobacteria fermentadora y oxidasa −.',kleb:'Klebsiella fermenta la lactosa y es oxidasa −.',samr:'el SAMR es coco Gram + en racimo.',legio:'Legionella casi no se ve con Gram y necesita BCYE.'}},
 {cuadro:'Otitis externa maligna',sint:'Le cuelga media cara y le supura el oído día y noche.',
  pistas:{interrogatorio:['Hombre de 75 años, diabético mal controlado.','Se limpia los oídos con hisopos.','No tuvo otitis media ni resfrío.','Evolución: 3 semanas de dolor de oído que empeora de noche, y otorrea.'],
   examen:['Tejido de granulación en el piso del conducto auditivo externo, otorrea verdosa.','Parálisis facial periférica del mismo lado: la infección llegó al hueso temporal.'],
   lab:['Gram de la secreción: bacilos Gram −.','Cultivo: no fermentador, oxidasa +, pigmento verde.','TC: osteomielitis de la base del cráneo.']},
  clave:'Anciano diabético + otalgia nocturna + granulación en el conducto + parálisis facial + no fermentador oxidasa + = otitis externa maligna',
  diferenciales:{asper:'la otomicosis por Aspergillus da otitis externa con «algodón» y puntos negros, sin osteomielitis.',mucor:'la mucormicosis da escara negra en paladar o cornetes en la cetoacidosis.',spneu:'el neumococo da otitis MEDIA con tímpano abombado.'},
  best:{ceftaz:'Ceftazidima EV: antipseudomónica, para arrancar.',cipro:'Ciprofloxacina: la única antipseudomónica oral; permite completar las semanas de tratamiento del hueso.'}}]},

menin:{c0:'Meningitis en conscripto',v:[
 {cuadro:'Meningococcemia fulminante',sint:'Manchas violetas que crecen mientras lo mirás, y las manos heladas.',
  pistas:{interrogatorio:['Nena de 6 años, previamente sana.','No tiene la vacuna antimeningocócica.','Un compañero del colegio estuvo internado ayer.','Evolución: 10 horas de fiebre y decaimiento; las manchas aparecieron hace 2 horas.'],
   examen:['Púrpura que NO se blanquea a la vitropresión, extremidades frías y TA 70/30.','Sin rigidez de nuca: la sepsis va por delante de la meningitis.'],
   lab:['Raspado de una petequia y hemocultivo: diplococos Gram − en «granos de café».','Cultivo: oxidasa +, fermenta glucosa y MALTOSA.','Plaquetas bajas, TP prolongado (CID) y cortisol bajo: hemorragia suprarrenal (Waterhouse-Friderichsen).']},
  clave:'Contacto con un caso + púrpura que no se borra + shock + CID + diplococo Gram − que fermenta maltosa = meningococcemia',
  diferenciales:{spneu:'el neumococo puede dar púrpura en esplenectomizados, pero es diplococo Gram + lanceolado.',hib:'H. influenzae es cocobacilo Gram −.',saureus:'el shock tóxico estafilocócico da eritrodermia difusa, no púrpura.',gono:'el gonococo fermenta solo glucosa y da pocas pústulas con artritis.'}},
 {cuadro:'Meningitis recurrente por déficit de complemento',sint:'Ya se transformó tres veces y siempre vuelve con la nuca dura.',
  pistas:{interrogatorio:['Mujer de 24 años.','Es su tercera meningitis en 5 años; un hermano tuvo dos.','No tuvo traumatismos de cráneo ni cirugías.','Evolución: 18 horas de fiebre, cefalea y vómitos.'],
   examen:['Rigidez de nuca y fotofobia.','Algunas petequias en el tronco.'],
   lab:['LCR: diplococos Gram − intra y extracelulares, PMN, glucosa baja.','Cultivo: oxidasa +, fermenta glucosa y maltosa; serogrupo Y.','CH50 indetectable: déficit de C5-C9 (no se arma el complejo de ataque de membrana).']},
  clave:'Meningitis a repetición + familiar afectado + CH50 nulo + diplococo Gram − maltosa + = meningococo por déficit de C5-C9',
  diferenciales:{spneu:'las meningitis recurrentes por neumococo hacen pensar en una fístula de LCR; además es diplococo Gram +.',gono:'el gonococo fermenta solo glucosa y no suele dar meningitis.',listeria:'Listeria es cocobacilo Gram + en inmunodeprimidos.'}}]},

gono:{c0:'Uretritis',v:[
 {cuadro:'Gonococcemia: artritis-dermatitis',sint:'Rengo de una rodilla, con la muñeca hinchada y unas pocas pústulas con sangre.',
  pistas:{interrogatorio:['Mujer de 22 años.','Tiene una pareja nueva desde hace un mes; no usan preservativo.','El cuadro empezó durante la menstruación.','Evolución: 4 días de dolor articular que salta de una articulación a otra, con fiebre.'],
   examen:['Tenosinovitis de los extensores de la muñeca y artritis de rodilla.','Escasas pústulas hemorrágicas en manos y pies.'],

  clave:'Mujer joven + menstruación + poliartralgia migratoria + tenosinovitis + pústulas hemorrágicas + diplococo Gram − que no fermenta maltosa',
  diferenciales:{menin:'el meningococo fermenta glucosa Y maltosa.',chlam:'la artritis reactiva por Chlamydia no tiene pústulas ni gérmenes en el líquido.',trepo:'la sífilis secundaria da rash palmo-plantar sin artritis séptica.',saureus:'la artritis séptica estafilocócica es monoarticular, con racimos, sin pústulas.'}},
 {cuadro:'Oftalmía neonatal',sint:'Un recién nacido con los párpados hinchados que chorrean pus amarillo.',
  pistas:{interrogatorio:['Recién nacido de 3 días.','La madre no tuvo controles prenatales.','No recibió profilaxis ocular al nacer.','Evolución: desde ayer, secreción ocular abundante en ambos ojos.'],
   examen:['Conjuntivitis purulenta bilateral muy copiosa con edema palpebral.','Riesgo de úlcera y perforación corneal.'],

  best:{ceftri:'Ceftriaxona en dosis única IM o EV + lavado ocular.'}}]},

hib:{c0:'Epiglotitis',v:[
 {cuadro:'Meningitis en lactante no vacunado',sint:'Un bebé que llora más fuerte cuando lo alzás, con la fontanela abombada.',
  pistas:{interrogatorio:['Lactante de 9 meses.','No tiene ninguna vacuna.','Va a la guardería; tuvo otitis el mes pasado.','Evolución: 24 horas de fiebre, vómitos y una convulsión.'],
   examen:['Fontanela abombada, rigidez de nuca, irritabilidad paradójica.','Sin petequias.'],
   lab:['LCR: cocobacilos Gram − pleomórficos, PMN, glucosa baja.','Crece solo en agar chocolate (necesita factor X hemina y V NAD); satelitismo alrededor de S. aureus en agar sangre.','Antígeno capsular PRP en LCR +. Productor de β-lactamasa.']},
  clave:'Lactante sin vacunas + meningitis + cocobacilo Gram − que necesita X y V + antígeno PRP = Hib',
  diferenciales:{menin:'el meningococo es diplococo Gram − y no necesita factores X y V.',spneu:'el neumococo es diplococo Gram + lanceolado.',listeria:'Listeria es Gram + y afecta a neonatos.',ecoli:'E. coli K1 afecta al neonato y crece en MacConkey.'}},
 {cuadro:'Celulitis bucal violácea',sint:'Un bebé con la mejilla hinchada y de color azul violeta.',
  pistas:{interrogatorio:['Lactante de 11 meses.','No completó el calendario de vacunas.','Tuvo otitis media del mismo lado.','Evolución: 1 día de fiebre alta y la mejilla que se pone violeta.'],
   examen:['Celulitis de la mejilla, de color azul-violáceo, caliente y dura.','Fiebre de 39,5 °C, irritable.'],
   lab:['Hemocultivo: cocobacilos Gram −.','Cultivo en agar chocolate; requiere X y V.','Aglutinación capsular tipo b.']},
  clave:'Lactante no vacunado + celulitis bucal azul-violácea + bacteriemia por cocobacilo Gram − X y V dependiente = Hib',
  diferenciales:{spyo:'la celulitis estreptocócica es roja y no violácea, con cocos en cadena.',saureus:'S. aureus da pus y forma racimos.',spneu:'el neumococo es diplococo Gram +.'}}]},

typhi:{c0:'Fiebre tifoidea en viajero',v:[
 {cuadro:'Perforación intestinal en la 3.ª semana',sint:'Tres semanas ardiendo de fiebre y ahora la panza se le pone dura como una tabla.',
  pistas:{interrogatorio:['Hombre de 25 años.','Volvió de un viaje a la India hace un mes.','Nunca se trató la fiebre: «pensó que era gripe».','Evolución: 3 semanas de fiebre; hoy, dolor abdominal súbito.'],
   examen:['Abdomen en tabla con rebote positivo: peritonitis. Bradicardia relativa.','Hepatoesplenomegalia y roséola en el tronco.'],
   lab:['En la 3.ª semana el hemocultivo ya rinde poco; coprocultivo y urocultivo positivos.','Bacilo Gram − móvil, lactosa −, H₂S + (colonias con centro negro en SS).','Antígeno Vi capsular. Rx: neumoperitoneo por úlcera perforada de las placas de Peyer.']},
  clave:'Viajero + fiebre de 3 semanas + bradicardia relativa + perforación ileal + bacilo lactosa − H₂S + con antígeno Vi',
  diferenciales:{shigella:'Shigella da disentería aguda, no fiebre de 3 semanas; es inmóvil y H₂S −.',bfrag:'la peritonitis por perforación de colon es mixta con anaerobios, sin fiebre previa de semanas.',lepto:'la leptospirosis da sufusión conjuntival y mialgias tras agua contaminada.',brucella:'Brucella da fiebre ondulante tras leche cruda, no perforación.'}},
 {cuadro:'Portadora crónica',sint:'Parece sana, pero deja huellas de bacilos en cada plato que sirve.',
  pistas:{interrogatorio:['Mujer de 50 años, cocinera de un comedor.','Tiene cálculos en la vesícula.','Ocho comensales tuvieron fiebre prolongada en los últimos meses.','Evolución: ella está asintomática; tuvo una «fiebre larga» hace años.'],
   examen:['Asintomática; dolor leve en hipocondrio derecho al palpar.','Sin fiebre, sin roséola.'],
   lab:['Coprocultivo positivo persistente por más de un año.','Bacilo Gram − móvil, lactosa −, H₂S +.','Anticuerpos anti-Vi altos (marcador de portador). Eco: litiasis vesicular, el reservorio.']},
  clave:'Cocinera + brotes en comensales + litiasis vesicular + coprocultivo positivo por más de un año + anti-Vi = portadora crónica de S. Typhi',
  diferenciales:{shigella:'Shigella no deja portadores crónicos en la vesícula y es H₂S −.',hpylori:'H. pylori vive en el estómago y no da fiebre a los comensales.',ecoli:'E. coli fermenta lactosa.'},

shigella:{c0:'Disentería en jardín',v:[
 {cuadro:'Convulsión febril con disentería',sint:'Un nene que convulsiona ardiendo de fiebre y después deja un charco de sangre y moco.',
  pistas:{interrogatorio:['Nene de 2 años.','En su casa no hay agua de red.','Su hermano tuvo diarrea la semana pasada.','Evolución: tuvo una convulsión con 40 °C; horas después, deposiciones con sangre.'],
   examen:['Fiebre de 40 °C, sin signos meníngeos.','Dolor abdominal, tenesmo y deshidratación leve.'],
   lab:['Copro en fresco: más de 20 leucocitos por campo y hematíes (diarrea inflamatoria).','Agar SS/XLD: colonias lactosa −, H₂S − (sin centro negro); inmóvil.','Aglutinación: serogrupo D (S. sonnei).']},
  clave:'Nene + convulsión febril + disentería con muchos leucocitos + bacilo lactosa − H₂S − inmóvil = Shigella',

 {cuadro:'Disentería del viajero',sint:'Volvió de vacaciones corriendo al baño cada media hora, con calambres que lo doblan.',
  pistas:{interrogatorio:['Hombre de 30 años.','Volvió hace 3 días de un viaje por el sudeste asiático.','Comió en puestos callejeros y tomó agua sin embotellar.','Evolución: 2 días de fiebre, cólicos, tenesmo y 12 deposiciones con sangre y moco.'],

  clave:'Viajero + disentería febril con tenesmo + leucocitos abundantes + bacilo inmóvil lactosa − H₂S − = Shigella',
  diferenciales:{eceh:'la ECEH no da fiebre y es sorbitol −.',vibrio:'el cólera da diarrea acuosa sin sangre ni fiebre.',typhi:'S. Typhi da fiebre prolongada sin disentería al comienzo.',cdiff:'C. difficile aparece tras antibióticos.'}}]},

vibrio:{c0:'Cólera',v:[

 {cuadro:'Cólera en viajero',sint:'Un mochilero arrugado como una pasa que no para de evacuar agua.',

legio:{c0:'Neumonía grave en fumador',v:[

 {cuadro:'Legionelosis nosocomial en trasplantado',sint:'Un trasplantado confundido, con diarrea y la piel mojada por la ducha del hospital.',

hpylori:{c0:'Úlcera duodenal',v:[
 {cuadro:'Linfoma MALT gástrico',sint:'Un hombre flaco con una masa gástrica que brilla, rodeado de espirales.',

   lab:['Biopsia: linfoma MALT de bajo grado con bacilos curvos en el moco.','Test rápido de ureasa de la biopsia +.','Test del aliento con urea marcada +.']},
  clave:'Dispepsia crónica + linfoma MALT de bajo grado + bacilos espiralados ureasa + = H. pylori (erradicarlo puede curar el linfoma)',
  diferenciales:{tbc:'la TBC digestiva da pérdida de peso con tos y BAAR, no linfoma MALT.',shigella:'Shigella da disentería aguda.',cdiff:'C. difficile da colitis tras antibióticos.'}},
 {cuadro:'Anemia ferropénica refractaria',sint:'Una adolescente pálida que no mejora con hierro, con un espiral girando en el estómago.',
  pistas:{interrogatorio:['Mujer de 16 años.','Toma hierro oral hace 6 meses y la anemia no se corrige.','Su madre tuvo una úlcera gástrica.','Evolución: cansancio de meses y dolor epigástrico ocasional.'],
   examen:['Palidez de piel y mucosas, uñas quebradizas.','Sin sangrado ginecológico abundante.'],
   lab:['Ferritina baja; sangre oculta en materia fecal negativa.','Antígeno de H. pylori en materia fecal +.','Endoscopía: gastritis antral nodular; ureasa de la biopsia +.']},
  clave:'Anemia ferropénica que no responde al hierro + gastritis antral + antígeno fecal y ureasa + = H. pylori',
  diferenciales:{vibrio:'el cólera da diarrea acuosa aguda.',cdiff:'C. difficile da diarrea tras antibióticos.',shigella:'Shigella da disentería.'}}]},

kpc:{c0:'Neumonía en terapia intensiva prolongada',v:[
 {cuadro:'Infección de sitio quirúrgico post-trasplante hepático',sint:'Una herida enorme en el abdomen que supura y se burla del meropenem.',
  pistas:{interrogatorio:['Hombre de 49 años, trasplantado de hígado hace 3 semanas.','Recibió meropenem y vancomicina en la UTI.','Estuvo colonizado por Klebsiella en el hisopado rectal.','Evolución: 3 días de fiebre y salida de pus por la herida.'],
   examen:['Herida con dehiscencia y pus espeso.','Taquicardia, TA en descenso.'],
   lab:['Gram del pus: bacilos Gram − capsulados.','Cultivo: Klebsiella resistente a meropenem; test de ácido borónico + (carbapenemasa de clase A).','PCR blaKPC +. Sensible a colistina.']},
  clave:'Trasplantado + carbapenémicos previos + colonización rectal + Klebsiella con ácido borónico + = KPC',
  diferenciales:{kleb:'la Klebsiella común (o BLEE) es sensible al meropenem.',pseudo:'Pseudomonas es no fermentador oxidasa +.',samr:'el SAMR es coco Gram +.',ecoli:'E. coli es móvil e indol +.'}},
 {cuadro:'Bacteriemia en hemodializado',sint:'Conectado a una máquina de diálisis que bombea Klebsiella a la sangre.',
  pistas:{interrogatorio:['Mujer de 67 años en hemodiálisis por catéter desde hace 8 meses.','Estuvo internada dos veces este año con carbapenémicos.','Vive en un geriátrico con brote de KPC.','Evolución: escalofríos y fiebre que empiezan al conectarla.'],
   examen:['Orificio del catéter con eritema.','Hipotensión durante la diálisis.'],
   lab:['Hemocultivos (catéter y periférico): bacilos Gram − capsulados; el del catéter se positiviza 2 horas antes.','Resistente a todos los betalactámicos y a ciprofloxacina.','Ácido borónico +, PCR blaKPC +.']},
  clave:'Catéter de diálisis + tiempo diferencial a favor del catéter + Klebsiella con ácido borónico + = bacteriemia por KPC',
  diferenciales:{kleb:'la Klebsiella sensible responde a la ceftriaxona.',samr:'el SAMR es la causa clásica de bacteriemia por catéter, pero es coco Gram +.',ckru:'Candida da fungemia por catéter con levaduras.',pseudo:'Pseudomonas es no fermentador.'}}]},

tetani:{c0:'Herida punzante en jardinero',v:[
 {cuadro:'Tétanos neonatal',sint:'Un recién nacido arqueado hacia atrás que no puede abrir la boca para mamar.',
  pistas:{interrogatorio:['Recién nacido de 7 días.','Nació en la casa; cortaron el cordón con una tijera de jardín.','La madre nunca recibió la vacuna antitetánica: el bebé no tiene anticuerpos maternos.','Evolución: 2 días; dejó de succionar y tiene espasmos cuando lo tocan.'],
   examen:['Trismus (no puede succionar), espasmos generalizados y opistótonos al estímulo.','Muñón umbilical sucio y con mal olor.'],
   lab:['Gram del muñón: bacilos Gram + con espora terminal «en palillo de tambor».','Cultivo anaerobio estricto: crecimiento en velo (swarming); positivo solo en un tercio de los casos.','El diagnóstico es clínico: la tetanospasmina bloquea la liberación de GABA y glicina en las interneuronas inhibitorias.']},
  clave:'Parto domiciliario + cordón con instrumento sucio + madre sin vacuna + trismus y opistótonos = tétanos neonatal',
  diferenciales:{botu:'el botulismo da parálisis FLÁCIDA, no espasmos.',menin:'la meningitis neonatal da fontanela abombada y fiebre, sin trismus.',sagal:'la sepsis por S. agalactiae da hipotonía y quejido, no rigidez.'}},
 {cuadro:'Tétanos en usuario de drogas',sint:'Una sonrisa forzada que no se borra y la espalda que se le dobla hacia atrás.',
  pistas:{interrogatorio:['Hombre de 38 años.','Se inyecta heroína por vía subcutánea («skin popping»).','No recibe refuerzos de vacuna desde la escuela.','Evolución: 4 días; empezó con dificultad para abrir la boca.'],
   examen:['Trismus, risa sardónica y rigidez de nuca; conciencia lúcida.','Absceso subcutáneo en el antebrazo, en el sitio de inyección.'],
   lab:['Gram del absceso: bacilos Gram + con espora terminal.','Cultivo anaerobio: C. tetani junto a otros gérmenes.','Diagnóstico clínico: la toxina viaja retrógrada por el axón hasta la médula.']},
  clave:'Inyección subcutánea de drogas + sin refuerzos + trismus + risa sardónica con conciencia lúcida = tétanos',
  diferenciales:{botu:'el botulismo por herida también aparece en usuarios de drogas, pero da parálisis flácida descendente.',menin:'la meningitis da fiebre y alteración de la conciencia.',perfri:'C. perfringens da gangrena con crepitación, no espasmos.'}}]},

botu:{c0:'Conserva casera',v:[
 {cuadro:'Botulismo del lactante',sint:'Un bebé blando como un trapo, con los párpados caídos y un frasco de miel.',
  pistas:{interrogatorio:['Lactante de 4 meses.','Le endulzan el chupete con miel y le dan té de yuyos.','En su intestino inmaduro todavía no hay flora que compita.','Evolución: una semana de constipación, succión y llanto cada vez más débiles.'],
   examen:['Hipotonía generalizada («bebé de trapo»), ptosis y reflejo pupilar lento.','Afebril y despierto.'],
   lab:['Toxina botulínica en materia fecal (bioensayo en ratón).','Cultivo anaerobio de heces: C. botulinum. Las esporas germinaron en el intestino.','Gram: bacilos Gram + con espora subterminal.']},
  clave:'Lactante + miel + constipación + hipotonía con ptosis + toxina en heces = botulismo del lactante',
  diferenciales:{tetani:'el tétanos da rigidez y espasmos, no flacidez.',listeria:'la listeriosis neonatal da fiebre y sepsis.',difteria:'la difteria da membrana faríngea antes de la parálisis.'},
  best:{antitox:'Inmunoglobulina botulínica humana: neutraliza la toxina libre. Es el tratamiento específico.'},
  nul:{penG:'En el lactante NO se dan antibióticos: lisar las bacterias del intestino libera más toxina.'}},
 {cuadro:'Botulismo por herida',sint:'Ve doble, no puede tragar y tiene un absceso negro en el brazo.',
  pistas:{interrogatorio:['Hombre de 35 años.','Se inyecta heroína negra («black tar»).','No comió conservas caseras.','Evolución: 2 días de visión doble, dificultad para tragar y debilidad que baja.'],
   examen:['Ptosis, midriasis, disfagia y parálisis flácida descendente simétrica.','Absceso en el sitio de inyección, sin fiebre.'],
   lab:['Gram del absceso: bacilos Gram + con espora.','Cultivo anaerobio del absceso: C. botulinum.','Toxina botulínica en suero: bloquea la liberación de acetilcolina en la placa motora.']},
  clave:'Heroína negra inyectada + absceso + parálisis flácida descendente con pares craneales + toxina en suero = botulismo por herida',
  diferenciales:{tetani:'el tétanos da espasmos y trismus.',difteria:'la difteria da membrana faríngea y miocarditis.',myco:'Mycoplasma no da parálisis.'},
  best:{antitox:'Antitoxina equina: neutraliza la toxina circulante.'},
  ok:{penG:'Acá sí: penicilina + desbridamiento, porque la fábrica de toxina es la herida.'}}]},

perfri:{c0:'Gangrena gaseosa',v:[
 {cuadro:'Intoxicación alimentaria',sint:'Se agarra la panza a los retorcijones con un plato de guiso recalentado.',
  pistas:{interrogatorio:['Hombre de 45 años.','Fue a un evento con catering: guiso de carne que se cocinó el día anterior y se recalentó.','Otros 20 invitados tienen lo mismo.','Evolución: empezó 10 horas después de comer: diarrea acuosa y cólicos, sin vómitos.'],
   examen:['Dolor abdominal difuso, sin fiebre.','Hidratado; se resuelve en 24 horas.'],
   lab:['En el guiso: más de 10⁵ bacterias por gramo; las esporas sobrevivieron a la cocción y germinaron al enfriar lento.','Cultivo anaerobio: doble halo de hemólisis; lecitinasa + (reacción de Nagler).','Enterotoxina CPE en heces: se libera al esporular en el intestino.']},
  clave:'Brote + carne recalentada + diarrea acuosa con cólicos a las 8-12 horas sin fiebre + lecitinasa + = C. perfringens tipo A',
  diferenciales:{saureus:'la toxina preformada de S. aureus da VÓMITOS a las 2-6 horas.',vibrio:'el cólera da diarrea profusa en agua de arroz.',eceh:'la ECEH da diarrea con sangre.',cdiff:'C. difficile aparece tras antibióticos.'},
  best:{sosten:'Es autolimitada: rehidratación. No se dan antibióticos.'},
  nul:{penG:'No hace falta: es una toxiinfección que se resuelve sola en un día.',clinda:'No hace falta: es autolimitada.'}},
 {cuadro:'Aborto séptico con hemólisis',sint:'Amarilla, con la orina negra y el útero que cruje.',
  pistas:{interrogatorio:['Mujer de 24 años.','Hace 2 días se hizo un aborto en condiciones inseguras.','No tiene enfermedades previas.','Evolución: 24 horas de fiebre, dolor pelviano y orina oscura.'],
   examen:['Útero doloroso y crepitante; flujo fétido.','Ictericia, hipotensión y hemoglobinuria: hemólisis intravascular masiva.'],
   lab:['Gram del exudado: bacilos Gram + grandes, rectangulares, sin esporas («en furgón»).','Cultivo anaerobio: doble halo de hemólisis.','Lecitinasa +: la toxina α destruye las membranas de los glóbulos rojos.']},
  clave:'Aborto inseguro + útero crepitante + hemólisis masiva + bacilos Gram + grandes sin esporas con doble hemólisis',
  diferenciales:{bfrag:'B. fragilis es un bacilo Gram − y no da hemólisis masiva.',spyo:'S. pyogenes da sepsis puerperal con cocos en cadena.',ecoli:'E. coli es bacilo Gram − aerobio facultativo.'}}]},

cdiff:{c0:'Diarrea post-antibiótico',v:[
 {cuadro:'Recurrencia',sint:'Volvió: la misma diarrea de hace un mes, con olor a establo.',
  pistas:{interrogatorio:['Mujer de 70 años.','Hace 5 semanas tuvo colitis por C. difficile tratada con metronidazol.','Ahora recibió amoxicilina por una infección dental.','Evolución: 3 días de diarrea acuosa, 8 veces por día.'],
   examen:['Dolor abdominal difuso, fiebre de 38 °C.','Sin signos de abdomen agudo.'],
   lab:['Glutamato deshidrogenasa (GDH) + en heces.','Toxinas A y B + por enzimoinmunoensayo.','Las esporas sobrevivieron al tratamiento anterior: recurrencia.']},
  clave:'Colitis por C. difficile reciente + nuevo antibiótico + diarrea + GDH y toxinas + = recurrencia',
  diferenciales:{shigella:'Shigella da disentería con fiebre alta en la comunidad.',eceh:'la ECEH da sangre sin fiebre tras carne mal cocida.',perfri:'C. perfringens da una diarrea de un día tras comida recalentada.'},
  best:{vanco:'Vancomicina ORAL en pauta descendente: no se absorbe y actúa en la luz del colon.'},
  nul:{metro:'En la recurrencia no se repite metronidazol: responde peor y su neurotoxicidad es acumulativa.'}},
 {cuadro:'Megacolon tóxico',sint:'La panza hinchada como un globo y, raro, ya no tiene diarrea.',
  pistas:{interrogatorio:['Hombre de 78 años internado por neumonía.','Recibió ceftriaxona y clindamicina.','Tuvo diarrea los primeros días.','Evolución: hoy no evacúa, tiene fiebre y el abdomen distendido.'],
   examen:['Distensión abdominal, ausencia de ruidos, dolor difuso.','Taquicardia, hipotensión.'],
   lab:['Leucocitos de 40.000/mm³ y ácido láctico alto.','Toxinas A y B + (en materia fecal del rectal).','Rx: colon transverso de más de 6 cm. Colonoscopía (con cuidado): pseudomembranas.']},
  clave:'Antibióticos + diarrea que se corta + distensión e íleo + leucocitosis extrema + toxinas + = megacolon tóxico por C. difficile',
  diferenciales:{shigella:'Shigella rara vez da megacolon en un internado sin antibióticos.',bfrag:'la peritonitis por B. fragilis sigue a una perforación, no a antibióticos.',eceh:'la ECEH da sangre sin fiebre.'},
  ok:{metro:'Metronidazol EV: se suma porque con íleo la vancomicina oral no llega bien (y se evalúa cirugía).'}}]},

bfrag:{c0:'Absceso por perforación colónica',v:[
 {cuadro:'Absceso tubo-ovárico',sint:'Una masa pelviana caliente que huele a podrido.',
  pistas:{interrogatorio:['Mujer de 28 años.','Usa DIU hace 6 años.','Tuvo una uretritis en la pareja hace meses.','Evolución: 10 días de dolor pelviano y fiebre.'],
   examen:['Masa anexial dolorosa; dolor a la movilización del cuello.','Flujo fétido.'],
   lab:['Punción de la colección: pus fétido; Gram con bacilos Gram − pleomórficos y otras bacterias (mixta).','Cultivo anaerobio estricto: crece en bilis 20%.','Produce β-lactamasa: resistente a penicilina.']},
  clave:'DIU + enfermedad pelviana + absceso fétido + bacilo Gram − anaerobio que crece en bilis = infección mixta con B. fragilis',
  diferenciales:{gono:'el gonococo inicia la EPI, pero el absceso maduro es polimicrobiano con anaerobios.',chlam:'Chlamydia da EPI silenciosa, no un absceso fétido.',ecoli:'E. coli crece en aerobiosis y no da olor fétido.'}},
 {cuadro:'Pie diabético con osteomielitis',sint:'Un pie negro y hediondo que supura hasta el hueso.',
  pistas:{interrogatorio:['Hombre de 63 años, diabético con neuropatía.','Tiene una úlcera plantar hace 3 meses.','No siente dolor en el pie.','Evolución: una semana de supuración fétida y fiebre.'],
   examen:['Úlcera profunda con hueso expuesto (sonda que toca hueso +), olor pútrido.','Crepitación leve por gas en los tejidos.'],
   lab:['Biopsia ósea: flora mixta; bacilos Gram − pleomórficos.','Cultivo anaerobio: crece en bilis; además S. aureus y enterobacterias.','RM: osteomielitis del metatarsiano.']},
  clave:'Pie diabético + úlcera profunda fétida + osteomielitis + anaerobio Gram − que crece en bilis = infección mixta con B. fragilis',
  diferenciales:{perfri:'la gangrena gaseosa avanza en horas con bacilos Gram + grandes.',saureus:'S. aureus acompaña, pero no explica el olor fétido.',pseudo:'Pseudomonas da olor a uva y es aerobia.'}}]},

trepo:{c0:'Sífilis primaria y secundaria',v:[
 {cuadro:'Sífilis congénita',sint:'Un bebé con mocos sanguinolentos, la piel de las palmas pelándose y un hígado enorme.',
  pistas:{interrogatorio:['Lactante de 3 semanas.','La madre tuvo una VDRL + en el embarazo y no se trató.','No hubo controles en el tercer trimestre.','Evolución: rinitis persistente («coriza sifilítica») y llanto al mover los brazos.'],
   examen:['Hepatoesplenomegalia, pénfigo palmo-plantar y rinitis sanguinolenta.','Pseudoparálisis de Parrot (le duele mover los brazos por la osteocondritis).'],
   lab:['Campo oscuro de la secreción nasal: espiroquetas móviles.','VDRL del bebé con títulos 4 veces mayores que la madre.','FTA-ABS IgM +. Rx: periostitis de huesos largos.']},
  clave:'Madre con VDRL no tratada + coriza + pénfigo palmo-plantar + pseudoparálisis + espiroquetas en campo oscuro = sífilis congénita',

 {cuadro:'Neurosífilis (tabes dorsal)',sint:'Camina dando golpes con los talones, mirando el piso, con las pupilas chiquitas.',
  pistas:{interrogatorio:['Hombre de 62 años.','Tuvo una «llaga» en el pene a los 30 años que se curó sola.','Nunca se trató.','Evolución: 2 años de dolores lancinantes en las piernas y marcha inestable.'],
   examen:['Marcha tabética, Romberg +, abolición de reflejos y de sensibilidad propioceptiva.','Pupilas de Argyll Robertson: acomodan pero no reaccionan a la luz.'],

  best:{penG:'Penicilina G CRISTALINA EV: la benzatínica no alcanza niveles en el LCR.'},
  ok:{ceftri:'Ceftriaxona EV: alternativa que llega al LCR.'}}]},

lepto:{c0:'Fase febril tras inundación',v:[
 {cuadro:'Enfermedad de Weil',sint:'Amarillo como un limón, escupiendo sangre y sin hacer pis.',
  pistas:{interrogatorio:['Hombre de 42 años, recolector de residuos.','Trabaja entre basura con ratas.','Hace 10 días tuvo fiebre y dolor de piernas que mejoró.','Evolución: volvió la fiebre; hoy está amarillo y orina poco.'],
   examen:['Ictericia rubínica, sufusión conjuntival y oliguria.','Hemoptisis y petequias: hemorragia pulmonar y vasculitis.'],

  diferenciales:{typhi:'la fiebre tifoidea da roséola y bradicardia relativa, sin falla renal con ictericia.',menin:'la meningococcemia da púrpura y shock de horas.',brucella:'Brucella da fiebre ondulante tras leche cruda, sin ictericia.',eceh:'el SUH es en niños tras diarrea con sangre.'}},
 {cuadro:'Meningitis aséptica en deportista',sint:'Un triatleta con los ojos rojos, la nuca dura y barro de río hasta las rodillas.',
  pistas:{interrogatorio:['Hombre de 29 años, triatleta.','Hace 9 días compitió nadando en un río después de lluvias intensas.','Tenía raspones en las piernas.','Evolución: 5 días de fiebre y mialgias; ahora cefalea intensa.'],

  clave:'Agua dulce tras lluvias + piel con raspones + fiebre + sufusión conjuntival + meningitis aséptica = leptospirosis anictérica',

chlam:{c0:'Cervicitis asintomática',v:[

 {cuadro:'Linfogranuloma venéreo',sint:'Un bubón inguinal que se parte en dos, como un surco.',

  best:{doxi:'Doxiciclina 21 días: elección en linfogranuloma venéreo.'},
