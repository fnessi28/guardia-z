myco:{c0:'Neumonía caminante',v:[
 {cuadro:'Miringitis bullosa con crioaglutininas',sint:'Le duele el oído, tose seco, y los dedos se le ponen violetas con el frío.',
  pistas:{interrogatorio:['Mujer de 16 años.','En su curso hay varios con tos desde hace semanas.','Es invierno.','Evolución: 2 semanas de tos seca y desde ayer otalgia intensa.'],
   examen:['Ampollas hemorrágicas en la membrana timpánica (miringitis bullosa).','Acrocianosis al frío; pocos ruidos agregados.'],
   lab:['Gram: sin gérmenes (no tiene pared).','Crioaglutininas IgM anti-I +: aglutinan glóbulos rojos en frío (hemólisis).','PCR faríngea de M. pneumoniae +.']},
  clave:'Adolescente + brote en el curso + tos seca prolongada + miringitis bullosa + crioaglutininas = Mycoplasma',
  diferenciales:{spneu:'el neumococo da otitis media con tímpano abombado, no ampollas, y se ve con Gram.',chlam:'C. trachomatis da neumonía en lactantes.',legio:'Legionella da neumonía grave en mayores con diarrea.',psittaci:'la psitacosis requiere contacto con aves.'}},
 {cuadro:'Mucositis y rash por Mycoplasma',sint:'Labios en carne viva, ojos rojos y una tos seca que no se va.',
  pistas:{interrogatorio:['Nene de 10 años.','No tomó medicamentos nuevos (ni anticonvulsivantes ni sulfas).','Su hermana tuvo tos de semanas.','Evolución: 10 días de tos seca; ahora llagas en la boca y ojos rojos.'],
   examen:['Mucositis oral grave con costras hemorrágicas en los labios y conjuntivitis.','Pocas lesiones cutáneas en diana; crepitantes leves.'],
   lab:['Gram: sin gérmenes.','Rx: infiltrado intersticial más florido que la auscultación.','PCR de M. pneumoniae + e IgM específica.']},
  clave:'Escolar + tos seca de semanas + mucositis grave sin fármaco desencadenante + PCR + = mucositis inducida por Mycoplasma',
  diferenciales:{spyo:'la escarlatina da lengua aframbuesada y rash áspero, no mucositis con costras.',saureus:'el SPEE respeta las mucosas.',chlam:'C. trachomatis no da mucositis.'},
  best:{macro:'Azitromicina: elección en chicos; actúa en la 50S y Mycoplasma no tiene pared que romper.'},
  nul:{doxi:'Doxiciclina se evita en menores de 8 años.'}}]},

brucella:{c0:'Tambero con fiebre ondulante',v:[
 {cuadro:'Orquiepididimitis por queso de cabra',sint:'Un testículo enorme y una camisa empapada de sudor que huele a paja.',
  pistas:{interrogatorio:['Hombre de 36 años.','Vende quesos de cabra frescos que trae del NOA.','Come el queso sin pasteurizar.','Evolución: un mes de fiebre vespertina con sudoración profusa; ahora dolor testicular.'],
   examen:['Orquiepididimitis unilateral (el eritritol del tejido genital la atrae).','Hepatoesplenomegalia leve.'],
   lab:['Hemocultivo en sistema automatizado, incubado 21 días: cocobacilos Gram − pequeños.','Medio de Castañeda: crece lento; ureasa +, oxidasa +.','Rosa de Bengala + y Wright con título alto (B. melitensis).']},
  clave:'Queso de cabra crudo + fiebre con sudoración + orquiepididimitis + cocobacilo Gram − de crecimiento lento + Wright + = Brucella',
  diferenciales:{tbc:'la TBC genital es crónica, con BAAR y piuria estéril.',typhi:'la fiebre tifoidea da roséola tras un viaje.',gono:'la epididimitis gonocócica viene con uretritis purulenta en jóvenes.',psittaci:'la psitacosis da neumonía tras contacto con aves.'}},
 {cuadro:'Infección de laboratorio',sint:'Una laboratorista con dolor de cadera y fiebre que sube y baja.',
  pistas:{interrogatorio:['Mujer de 30 años, bioquímica.','Hace 6 semanas procesó un hemocultivo «raro» fuera de la cabina de seguridad.','No toma leche cruda.','Evolución: un mes de fiebre ondulante, cansancio y dolor lumbar bajo.'],
   examen:['Sacroileítis: dolor a la compresión de la articulación sacroilíaca.','Esplenomegalia.'],
   lab:['Hemocultivo: cocobacilos Gram − pequeños de crecimiento lento.','Castañeda: catalasa +, oxidasa +, ureasa +.','Rosa de Bengala + y Wright +: Brucella es la primera causa de infección adquirida en el laboratorio (por aerosoles).']},
  clave:'Bioquímica + aerosol de un cultivo + fiebre ondulante + sacroileítis + Wright + = brucelosis de laboratorio',
  diferenciales:{tbc:'el mal de Pott afecta columna dorsal, con BAAR.',typhi:'la fiebre tifoidea no da sacroileítis.',lepto:'Leptospira se adquiere en agua, no en el laboratorio.'}}]},

tbc:{c0:'Tisis cavitaria en HIV',v:[
 {cuadro:'Meningitis tuberculosa en un nene',sint:'Un nene somnoliento con un ojo desviado y un abuelo que tose en la puerta.',
  pistas:{interrogatorio:['Nene de 3 años.','Vive con su abuelo, que tose hace meses.','No recibió la BCG.','Evolución: 2 semanas de fiebre baja e irritabilidad; hoy está somnoliento.'],
   examen:['Parálisis del VI par, rigidez de nuca leve.','Somnolencia: meningitis basilar con hidrocefalia.'],
   lab:['LCR claro, linfocitos, glucosa MUY baja, proteínas muy altas, ADA elevado. Ziehl casi nunca +.','PCR GeneXpert MTB en LCR +; sensible a rifampicina.','Cultivo en Löwenstein-Jensen positivo a las 5 semanas. Rx: TBC miliar.']},
  clave:'Contacto con tosedor crónico + sin BCG + meningitis subaguda basilar + LCR con linfocitos y glucosa muy baja + GeneXpert + = meningitis TBC',
  diferenciales:{crypto:'Cryptococcus da meningitis subaguda en VIH, con tinta china +.',listeria:'Listeria da meningitis aguda en neonatos, mayores o inmunodeprimidos.',spneu:'el neumococo da meningitis aguda purulenta.',hib:'Hib da meningitis aguda purulenta en lactantes no vacunados.'},
  ok:{cipro:'Las quinolonas son de segunda línea; acá va RIPE + corticoides.'}},
 {cuadro:'Mal de Pott',sint:'Camina encorvado con una giba en la espalda y las piernas que le fallan.',
  pistas:{interrogatorio:['Hombre de 40 años, migrante de Bolivia.','Vive en una vivienda hacinada.','No tiene tos ni fiebre alta.','Evolución: 6 meses de dolor dorsal; ahora debilidad en las piernas.'],
   examen:['Giba dorsal (cifosis angular) y absceso frío paravertebral.','Paraparesia por compresión medular.'],
   lab:['Biopsia del absceso: granuloma con necrosis caseosa y BAAR.','Cultivo en Löwenstein-Jensen + a las 6 semanas.','IGRA +. RM: destrucción de dos vértebras dorsales con el disco afectado.']},
  clave:'Hacinamiento + dolor dorsal de meses + giba + absceso frío + granuloma caseoso con BAAR = mal de Pott',
  diferenciales:{brucella:'la espondilitis por Brucella prefiere la columna LUMBAR, con fiebre ondulante tras leche cruda.',saureus:'la osteomielitis vertebral por S. aureus es aguda y piógena.',paraco:'Paracoccidioides da úlceras mucosas, no un absceso vertebral típico.'}}]},

/* ---------- PISO 4 ---------- */
calb:{c0:'Candidiasis oral en HIV',v:[
 {cuadro:'Vulvovaginitis',sint:'Rascándose sin parar, con un flujo blanco grumoso como leche cortada.',
  pistas:{interrogatorio:['Mujer de 28 años.','Terminó un tratamiento con amoxicilina la semana pasada (la microbiota vaginal se alteró).','Toma anticonceptivos orales.','Evolución: 4 días de prurito vulvar intenso y ardor.'],
   examen:['Flujo blanco, grumoso, sin mal olor; vulva eritematosa con fisuras.','pH vaginal de 4 (normal): Candida no lo modifica.'],
   lab:['KOH del flujo: levaduras con pseudohifas (forma invasora).','Sabouraud: colonias cremosas blancas en 48 h.','Tubo germinal +: C. albicans.']},
  clave:'Antibióticos recientes + prurito + flujo en leche cortada + pH normal + levaduras con pseudohifas y tubo germinal + = vulvovaginitis candidiásica',
  diferenciales:{chlam:'la cervicitis por Chlamydia es casi asintomática, sin flujo grumoso.',gono:'la cervicitis gonocócica da flujo purulento con diplococos Gram −.',ckru:'C. krusei es tubo germinal −.'},
  best:{fluco:'Fluconazol oral en dosis única.'},
  ok:{nista:'Nistatina en óvulos: tópica, sirve.'}},
 {cuadro:'Candidemia por catéter',sint:'Fiebre que no cede, un catéter en el cuello y puntitos blancos en el fondo de ojo.',
  pistas:{interrogatorio:['Hombre de 56 años en la UTI.','Tiene catéter venoso central y nutrición parenteral.','Recibe antibióticos de amplio espectro hace 10 días; operado del abdomen.','Evolución: fiebre que persiste pese a los antibióticos.'],
   examen:['Sin foco bacteriano evidente.','Fondo de ojo: exudados algodonosos blancos (endoftalmitis candidiásica).'],
   lab:['Hemocultivo: levaduras (en sangre nunca es contaminación).','CHROMagar: colonias verdes; tubo germinal +: C. albicans.','β-D-glucano sérico elevado.']},
  clave:'UTI + catéter + nutrición parenteral + antibióticos + fiebre refractaria + levaduras en hemocultivo + tubo germinal + = candidemia por C. albicans',
  diferenciales:{ckru:'C. krusei es tubo germinal − y da rosa en CHROMagar.',samr:'el SAMR da bacteriemia por catéter con cocos Gram +.',crypto:'Cryptococcus es capsulado y no forma pseudohifas.'},
  best:{equino:'Equinocandina: elección en candidemia (fungicida y activa sobre el biofilm). Y se saca el catéter.'},
  ok:{fluco:'Fluconazol: para pasar a vía oral cuando está estable y la especie es sensible (y llega bien al ojo).'},
  nul:{nista:'La nistatina no se absorbe: no sirve para nada sistémico.'}},
 {cuadro:'Dermatitis del pañal',sint:'Un bebé con la cola roja brillante y granitos sueltos alrededor.',
  pistas:{interrogatorio:['Lactante de 9 meses.','Usa pañales descartables que le cambian poco.','Hace una semana tomó antibióticos por otitis.','Evolución: 5 días de lesión en la zona del pañal que no mejora con cremas comunes.'],
   examen:['Placa roja brillante que toma los pliegues inguinales.','Pústulas SATÉLITES por fuera del borde.'],
   lab:['KOH del raspado: levaduras y pseudohifas.','Sabouraud: colonias cremosas.','Tubo germinal +.']},
  clave:'Pañal + antibióticos + placa roja que toma los pliegues + pústulas satélites + pseudohifas = candidiasis del pañal',
  diferenciales:{dermato:'la tiña tiene borde activo neto, sin satélites.',saureus:'el impétigo ampolloso da ampollas y costras.',spyo:'el estreptococo perianal da eritema de borde neto sin satélites.'},
  best:{nista:'Nistatina tópica: elección; no se absorbe y no hace falta más.'},
  ok:{fluco:'Fluconazol oral funciona, pero es innecesario para una lesión de piel.'}}]},

ckru:{c0:'Candidemia en neutropénico',v:[
 {cuadro:'Endoftalmitis',sint:'Ve todo nublado de un ojo y en el vítreo flotan bolitas blancas.',
  pistas:{interrogatorio:['Mujer de 48 años con leucemia.','Recibió fluconazol profiláctico por semanas.','Tuvo candidemia hace 10 días tratada con caspofungina.','Evolución: 3 días de visión borrosa y moscas volantes en el ojo derecho.'],
   examen:['Vitritis con «bolas de algodón» en el vítreo.','Fiebre baja.'],
   lab:['Aspirado vítreo: levaduras con pseudohifas.','CHROMagar: colonias ROSAS; tubo germinal −.','Antifungigrama: resistencia intrínseca a fluconazol (baja afinidad de la 14α-desmetilasa).']},
  clave:'Profilaxis con fluconazol + candidemia previa + endoftalmitis + tubo germinal − + CHROMagar rosa = C. krusei',
  diferenciales:{calb:'C. albicans es tubo germinal + y verde en CHROMagar.',asper:'Aspergillus da hifas tabicadas, no levaduras.',crypto:'Cryptococcus es una levadura capsulada sin pseudohifas.'},
  best:{vori:'Voriconazol: cubre C. krusei y llega muy bien al vítreo.',anfo:'Anfotericina B liposomal: alternativa fungicida.'},
  nul:{equino:'La equinocandina es elección en candidemia, pero llega MAL al ojo: en la endoftalmitis no alcanza.'}}]},

crypto:{c0:'Meningitis en HIV',v:[
 {cuadro:'Criptococosis cutánea diseminada',sint:'La cara llena de granitos con un hoyito en el centro, y una paloma en el hombro.',
  pistas:{interrogatorio:['Hombre de 52 años, trasplantado de riñón hace un año.','Cría palomas en la terraza.','Toma tacrolimus y prednisona.','Evolución: 3 semanas de pápulas en la cara y cefalea leve.'],
   examen:['Pápulas umbilicadas que parecen molusco contagioso.','Rigidez de nuca dudosa: la lesión de piel obliga a hacer punción lumbar.'],
   lab:['Biopsia de piel con tinta china y mucicarmín: levaduras con cápsula gruesa.','Cultivo en agar alpiste negro (Guizotia): colonias MARRONES (fenoloxidasa). Ureasa +.','Antígeno capsular en suero y LCR +: hay meningitis.']},
  clave:'Inmunodeprimido + palomas + pápulas umbilicadas + levadura capsulada marrón en alpiste negro + antígeno en LCR = criptococosis diseminada',
  diferenciales:{histo:'Histoplasma son levaduras chiquitas dentro de macrófagos, sin cápsula.',calb:'Candida no tiene cápsula y forma pseudohifas.',dermato:'los dermatofitos no dan pápulas umbilicadas ni meningitis.'}},
 {cuadro:'Meningitis con hipertensión endocraneana grave',sint:'Ve borroso, vomita en chorro y le late la cabeza como para estallar.',
  pistas:{interrogatorio:['Mujer de 30 años con VIH sin tratamiento, CD4 de 40.','Vive en una casa vieja con palomares en el techo.','No toma profilaxis.','Evolución: un mes de cefalea progresiva; ahora visión borrosa.'],
   examen:['Papiledema bilateral y parálisis del VI par; signos meníngeos leves.','Presión de apertura del LCR de 40 cm H₂O.'],
   lab:['LCR claro con pocos linfocitos; tinta china: levaduras con halo.','Alpiste negro: colonias marrones; ureasa +.','Antígeno capsular con título muy alto: el polisacárido tapa las vellosidades aracnoideas.']},
  clave:'VIH con CD4 bajo + palomas + cefalea subaguda + papiledema + presión de apertura altísima + tinta china + = criptococosis meníngea',
  diferenciales:{tbc:'la meningitis TBC tiene glucosa muy baja y ADA alto, sin levaduras.',listeria:'Listeria da meningitis aguda con Gram +.',menin:'el meningococo da meningitis aguda purulenta.'},
  best:{anfo:'Anfotericina B + flucitosina en la inducción, y punciones evacuadoras para bajar la presión: la hipertensión endocraneana es lo que mata.'}}]},

asper:{c0:'Aspergilosis invasiva en neutropénico',v:[
 {cuadro:'Aspergiloma',sint:'Tose sangre, y dentro del pecho rueda una bola de moho cuando se acuesta.',
  pistas:{interrogatorio:['Hombre de 55 años.','Tuvo tuberculosis hace 15 años, curada, que le dejó una cavidad.','No es inmunodeprimido.','Evolución: 2 meses de hemoptisis leves repetidas.'],
   examen:['Buen estado general, sin fiebre.','Rx: masa redonda dentro de la cavidad con una medialuna de aire arriba, que se mueve al cambiar de decúbito (signo de Monod).'],
   lab:['Esputo: hifas finas tabicadas con ramificación a 45°.','Sabouraud sin cicloheximida: colonias verde azuladas; cabeza aspergilar.','IgG precipitante anti-Aspergillus +. El hongo coloniza la cavidad sin invadir la pared.']},
  clave:'Cavidad de TBC curada + hemoptisis + bola móvil con medialuna de aire + hifas a 45° + precipitinas = aspergiloma',
  diferenciales:{tbc:'la reactivación TBC da fiebre, sudoración y BAAR, no una bola móvil.',mucor:'Mucorales da hifas anchas no tabicadas en inmunodeprimidos.',histo:'Histoplasma da cavidades con levaduras intracelulares.'},
  best:{itra:'Itraconazol si no se puede operar o hay síntomas. El tratamiento de fondo es la CIRUGÍA (o embolización si sangra): el hongo no invade.'},
  ok:{vori:'Voriconazol funciona, pero acá la cirugía es lo que resuelve.'}},
 {cuadro:'Aspergilosis broncopulmonar alérgica',sint:'Un asmático que escupe tapones marrones y silba al respirar.',
  pistas:{interrogatorio:['Mujer de 24 años con asma desde la infancia.','El asma empeoró en los últimos meses pese a los inhaladores.','No es inmunodeprimida.','Evolución: tos con tapones de moco marrón y sibilancias.'],
   examen:['Sibilancias difusas.','Rx: infiltrados migratorios; TC: bronquiectasias centrales.'],
   lab:['Eosinofilia y cristales de Charcot-Leyden en el esputo.','IgE total mayor de 1000 UI/ml e IgE específica contra Aspergillus.','Prick test +: hipersensibilidad tipo I (y III).']},
  clave:'Asma que empeora + tapones marrones + infiltrados migratorios + bronquiectasias centrales + IgE muy alta = ABPA',
  diferenciales:{tbc:'la TBC no da eosinofilia ni IgE alta.',pjiro:'Pneumocystis aparece en inmunodeprimidos con vidrio esmerilado.',myco:'Mycoplasma da neumonía atípica sin eosinofilia.'},
  best:{itra:'Itraconazol: baja la carga fúngica y permite bajar corticoides. La base es el CORTICOIDE: es una alergia.'},
  ok:{vori:'Voriconazol: alternativa.'},
  nul:{anfo:'La anfotericina no tiene lugar en una alergia: el problema es la respuesta exagerada.'}}]},

histo:{c0:'Pulmonar aguda en espeleólogo',v:[
 {cuadro:'Diseminada en SIDA',sint:'Pálido, flaco, con úlceras en la boca y el hígado que se le sale de la panza.',
  pistas:{interrogatorio:['Hombre de 38 años con VIH sin tratamiento, CD4 de 40.','Vive en el conurbano bonaerense (zona endémica).','Trabajó demoliendo un galpón con palomas.','Evolución: 6 semanas de fiebre, diarrea y pérdida de 10 kilos.'],
   examen:['Hepatoesplenomegalia, adenopatías y úlceras orales de fondo granulomatoso.','Pápulas cutáneas.'],
   lab:['Frotis de sangre con Giemsa: levaduras chiquitas DENTRO de macrófagos y neutrófilos.','Cultivo a 28 °C: macroconidios tuberculados; a 37 °C: levaduras.','Antígeno de Histoplasma en orina +. Pancitopenia por infiltración de médula.']},
  clave:'SIDA + zona endémica + fiebre, hepatoesplenomegalia y pancitopenia + levaduras intracelulares + antígeno urinario = histoplasmosis diseminada',
  diferenciales:{crypto:'Cryptococcus es capsulado y extracelular, con tinta china +.',tbc:'la TBC diseminada da BAAR, no levaduras.',pjiro:'Pneumocystis da neumonía, no hepatoesplenomegalia.',paraco:'Paracoccidioides son levaduras grandes en rueda de timón.'},
  best:{anfo:'Anfotericina B liposomal en la forma grave; después itraconazol de mantenimiento.'},
  ok:{itra:'Itraconazol: para mantenimiento después de la anfotericina.'}},
 {cuadro:'Pulmonar crónica cavitaria',sint:'Un fumador que tose hace meses, con dos agujeros en lo alto de los pulmones.',
  pistas:{interrogatorio:['Hombre de 62 años, EPOC, fumador.','Vive en Entre Ríos, cerca del río; tiene gallinero.','Tres baciloscopías negativas.','Evolución: 5 meses de tos productiva, pérdida de peso y hemoptisis leve.'],
   examen:['Roncus y crepitantes en ambos vértices.','Adelgazado, sin fiebre alta.'],
   lab:['Esputo con Giemsa: levaduras pequeñas intracelulares.','Cultivo a 28 y 37 °C: conversión de moho a levadura; macroconidios tuberculados.','Inmunodifusión (bandas H y M) +.']},
  clave:'EPOC + gallinero en zona húmeda + cavidades apicales + BAAR negativos + levaduras chiquitas intracelulares = histoplasmosis crónica',
  diferenciales:{tbc:'la TBC tendría BAAR.',paraco:'Paracoccidioides da infiltrados en alas de mariposa y úlceras mucosas, con levaduras grandes.',asper:'Aspergillus da hifas, no levaduras.',cocci:'Coccidioides es del oeste árido y forma esférulas.'}}]},

paraco:{c0:'Crónica del adulto con estomatitis',v:[
 {cuadro:'Forma juvenil ganglionar',sint:'Un adolescente con el cuello lleno de ganglios que supuran, sin tos.',
  pistas:{interrogatorio:['Varón de 16 años de Misiones.','Ayuda a su familia en la chacra.','Antes de la pubertad no hay protección estrogénica: afecta igual a ambos sexos.','Evolución: 2 meses de fiebre, adenopatías que crecen y pérdida de peso.'],
   examen:['Adenopatías cervicales y axilares masivas que fistulizan; hepatoesplenomegalia.','Sin lesiones mucosas y pulmones casi limpios.'],
   lab:['Punción ganglionar con KOH: levaduras GRANDES con gemación múltiple en rueda de timón.','Cultivo: a 37 °C, levaduras multigemantes.','Serología gp43 + con título alto (sirve para el seguimiento).']},
  clave:'Adolescente rural del NEA + adenopatías masivas que supuran + hepatoesplenomegalia sin tos + rueda de timón = paracoccidioidomicosis juvenil',
  diferenciales:{histo:'Histoplasma son levaduras chiquitas intracelulares.',tbc:'la adenitis TBC tiene BAAR y granulomas caseosos.',brucella:'Brucella da fiebre ondulante tras leche cruda.',sporo:'Sporothrix da nódulos linfáticos en un miembro tras una espina.'},
  best:{anfo:'Anfotericina B en la forma grave diseminada; después itraconazol o TMP-SMX.',itra:'Itraconazol: para completar meses de tratamiento.'}},
 {cuadro:'Insuficiencia suprarrenal décadas después',sint:'Bronceado sin haber tomado sol, débil y con la presión por el piso.',
  pistas:{interrogatorio:['Hombre de 65 años que vive en Buenos Aires.','Trabajó en el desmonte en Chaco hasta los 40 años.','Fumador de 40 paquetes/año.','Evolución: meses de cansancio, pérdida de peso y mareos al pararse.'],
   examen:['Hiperpigmentación de piel y mucosas; hipotensión ortostática.','Cicatrices de úlceras en encías.'],
   lab:['Sodio bajo, potasio alto, cortisol bajo: Addison.','TC: suprarrenales agrandadas; biopsia con levaduras multibrotantes en rueda de timón.','Serología gp43 +. La reactivación ocurrió décadas después de la exposición.']},
  clave:'Ex trabajador rural del NEA + décadas de latencia + Addison + levaduras en rueda de timón = paracoccidioidomicosis crónica',
  diferenciales:{tbc:'la TBC suprarrenal es la otra gran causa de Addison infeccioso, con BAAR.',histo:'Histoplasma también afecta suprarrenales, pero son levaduras chiquitas intracelulares.',calb:'Candida no da Addison.'}}]},

pjiro:{c0:'Neumonía en HIV',v:[
 {cuadro:'Neumonía al bajar los corticoides',sint:'Una señora que se ahoga al caminar dos pasos y tiene los pulmones de vidrio.',
  pistas:{interrogatorio:['Mujer de 60 años con artritis reumatoidea.','Toma prednisona en dosis altas hace 3 meses; la están bajando.','No recibe profilaxis con TMP-SMX.','Evolución: 5 días de disnea que avanza rápido y tos seca.'],
   examen:['Desaturación con mínimo esfuerzo, auscultación casi normal.','Taquipnea, fiebre moderada.'],
   lab:['LBA con Grocott: quistes negros «en copa» sobre fondo verde, en exudado espumoso.','β-D-glucano sérico muy alto. No se cultiva.','LDH elevada; TC con vidrio esmerilado bilateral.']},
  clave:'Corticoides en dosis altas sin profilaxis + disnea rápida al bajar la dosis + vidrio esmerilado + Grocott + = Pneumocystis',
  diferenciales:{asper:'Aspergillus da nódulos con halo en neutropénicos, con hifas.',legio:'Legionella da consolidación con hiponatremia y antígeno urinario +.',myco:'Mycoplasma afecta jóvenes sanos.',crypto:'Cryptococcus es una levadura capsulada con tinta china +.'}}]},

dermato:{c0:'Tiña corporis por gato',v:[
 {cuadro:'Querion de Celso',sint:'Un nene con una placa hinchada y supurada en la cabeza, y un gatito en brazos.',
  pistas:{interrogatorio:['Nene de 6 años.','Adoptaron un gatito hace un mes.','Antes de la pubertad no hay ácidos grasos fungistáticos en el sebo del cuero cabelludo.','Evolución: 3 semanas; empezó como una placa con descamación y se inflamó.'],

const EBY=Object.fromEntries(E.map(e=>[e.id,e]));
// Los patógenos nuevos también entran como diferenciales de los bichos con los que se confunden.
[['listeria','sagal','S. agalactiae también es CAMP +, pero es coco Gram + en cadena, catalasa − e inmóvil.'],

].forEach(([a,b,t])=>{EBY[a].diferenciales[b]=t});
Object.entries(CASOS).forEach(([id,c])=>{EBY[id].cuadro=c.c0;EBY[id].casos=c.v||[]});
const nCasos=e=>1+(e.casos||[]).length;
const cuadros=e=>[e.cuadro].concat((e.casos||[]).map(v=>v.cuadro));
// Arma el paciente concreto: el base (ci 0) o una variante que pisa pistas, clave y diferenciales, y retoca armas.
function caseOf(id,ci){
 const b=EBY[id],v=ci?(b.casos||[])[ci-1]:null,K=['best','ok','res','nul'];
 if(!v)return Object.assign({},b,{ci:0});
 const d=Object.assign({},b,{ci,cuadro:v.cuadro,sint:v.sint||b.sint,clave:v.clave,diferenciales:v.diferenciales||b.diferenciales,
  pistas:{interrogatorio:v.pistas.interrogatorio,examen:v.pistas.examen,lab:v.pistas.lab||b.pistas.lab}});
 K.forEach(k=>d[k]=Object.assign({},b[k]||{}));
 K.forEach(k=>{if(v[k])Object.keys(v[k]).forEach(w=>{K.forEach(j=>delete d[j][w]);d[k][w]=v[k][w]})});
 return d;
}

/* ============ LÓGICA DE TIRO ============ */
const gramOf=e=>e.g||(e.stain==='pos'?'+':e.stain==='neg'?'-':null);
function generic(w,e){
 const cls=w.cls||'ab',g=gramOf(e),f=e.flags||{};
 if(e.kind==='hongo'&&cls==='ab') return 'Antibacteriano contra un hongo: es eucariota, sin peptidoglicano y con ribosoma 80S. No hay blanco.';
 if(e.kind!=='hongo'&&cls==='af') return 'Antifúngico contra una bacteria: no tiene ergosterol ni pared de glucanos. No hay blanco.';
 if(w.id==='antitox') return 'No hay una toxina para neutralizar con antitoxina en este bicho.';
 if(w.id==='sosten') return 'Con sostén solo no alcanza: este necesita tratamiento específico.';
 if(e.kind==='hongo') return w.n+' no es la opción indicada para este hongo.';
 if(f.myco) return 'Pared llena de ácidos micólicos: casi impermeable. Las micobacterias necesitan un esquema combinado y largo.';
 if((w.fam==='bl'||w.id==='vanco')&&f.sinPared) return 'No tiene pared de peptidoglicano: no hay nada que romper.';
 if(w.fam==='bl'&&f.intracel) return 'Vive dentro de las células: el betalactámico casi no penetra y no lo alcanza.';
 if(w.id==='vanco'&&g==='-') return 'La vancomicina es una molécula enorme: no atraviesa la membrana externa de los Gram −.';
 if(w.id==='genta'&&f.anaerobio) return 'Los aminoglucósidos entran por un transporte que depende de O₂: en un anaerobio no entran.';
 if(w.id==='metro'&&!f.anaerobio) return 'El metronidazol necesita reducirse en ambiente anaerobio para activarse: acá no se activa.';
 if(w.id==='colis'&&g!=='-') return 'La colistina ataca el LPS de la membrana externa: este bicho no tiene.';
 if(w.id==='nitro') return 'La nitrofurantoína solo concentra en orina: sirve para cistitis y nada más.';
 if(w.id==='ripe') return 'El esquema RIPE es para micobacterias: acá es munición pesada al voleo.';
 if((w.id==='oxa'||w.id==='cefa1'||w.id==='penG')&&g==='-') return w.n+' tiene espectro de Gram +: no atraviesa bien las porinas de este Gram −.';
 return w.n+' no es una opción indicada para este bicho: le hace cosquillas.';
}
function evalShot(w,e){
 if(e.best&&e.best[w.id]) return {t:'best',txt:e.best[w.id]};
 if(e.ok&&e.ok[w.id]) return {t:'ok',txt:e.ok[w.id]};
 if(e.res&&e.res[w.id]) return {t:'res',txt:e.res[w.id]};
 if(e.nul&&e.nul[w.id]) return {t:'nul',txt:e.nul[w.id]};
 if(e.allAb&&(w.cls||'ab')==='ab') return {t:'res',txt:e.allAb};
 return {t:'nul',txt:generic(w,e)};
}

const TAG={sint:['Impresión','p'],int:['Interrog.','p'],ex:['Examen','p'],lab:['Lab','p'],atk:['Virulencia','p'],hint:['Residente','p'],
 best:['Efectivo','d'],ok:['Sirve','d'],res:['Resiste','d e'],nul:['Sin efecto','d e'],dx:['Dx ✓',''],dxbad:['Dx ✗','e'],warn:['Alerta',''],info:['Turno','']};
const salaHead=r=>'<b>'+r.where+'</b> · '+(r.known?EBY[r.id].n:'???')+(r.boss?' · jefe':'');
function lineEl(it){

 if(it.k==='sala'){el.className='sep';el.dataset.room=it.room;el.innerHTML=it.h;return el}
 const t=TAG[it.k]||TAG.info;

}
function appendLine(it,force){

}
function say(html,k){const it={k:k||'info',h:html};S.journal.push(it);appendLine(it);saveLast()}
function reveal(rec){
 if(rec.known)return;rec.known=true;
 const i=S.hist.indexOf(rec),it=S.journal.find(x=>x.k==='sala'&&x.room===i);
 if(it){it.h=salaHead(rec);const el=$('log').querySelector('.sep[data-room="'+i+'"]');if(el)el.innerHTML=it.h}
}

/* ============ PISTAS Y DIAGNÓSTICO ============ */
const clues=e=>e.hc.int.length+e.hc.ex.length+e.hc.lab.length;
// Pocas pistas = ×1,6; cada pista después de la segunda resta 0,075 hasta el piso de ×1,3.
const multFor=n=>Math.max(1.3,Math.min(1.6,1.6-0.075*(n-2)));
const fmt=m=>String(Math.round(m*100)/100).replace('.',',');
const LABN=['Tinción','Cultivo y bioquímica','Confirmatoria'];
const canAct=()=>{const e=S.enemy;return !!e&&!S.busy&&e.dying<0};
async function reveal1(list,got,k,emptyMsg){
 const e=S.enemy;if(!canAct())return;
 if(got.length>=list.length){say(emptyMsg,'info');return}
 S.busy=true;const p=list[got.length];got.push(p);
 say(k==='lab'?'<b>'+LABN[got.length-1]+':</b> '+p:p,k);
 if(k==='lab')e.scanned=true;
 render();await wait(650);await enemyTurn(true);
}
const ask=()=>S.enemy&&reveal1(S.enemy.d.pistas.interrogatorio,S.enemy.hc.int,'int','Ya te contó todo lo que sabe.');
const examine=()=>S.enemy&&reveal1(S.enemy.d.pistas.examen,S.enemy.hc.ex,'ex','Ya lo examinaste de pies a cabeza.');
const scan=()=>S.enemy&&reveal1(S.enemy.d.pistas.lab,S.enemy.hc.lab,'lab','El laboratorio ya informó todo.');
function diagnose(){
 const e=S.enemy;if(!canAct()||e.diag)return;
 const kind=x=>x.kind||'bac';
 let opts=shuffle(Object.keys(e.d.diferenciales||{}).filter(id=>EBY[id]&&!e.wrong.includes(id))).slice(0,3);
 if(opts.length<3)opts=opts.concat(shuffle(E.filter(x=>x.id!==e.d.id&&!opts.includes(x.id)&&!e.wrong.includes(x.id)&&kind(x)===kind(e.d))).slice(0,3-opts.length).map(x=>x.id));
 opts=shuffle([e.d.id,...opts]);
 const n=clues(e);
 openOv('<h3>Diagnosticar · '+n+' pista'+(n===1?'':'s')+'</h3><h2>¿Qué bicho es?</h2><p class="lead">Si acertás, tus disparos pegan <b style="color:var(--accent)">×'+fmt(multFor(n))+'</b>: más fuerte cuantas menos pistas pediste. Si errás, ves el dato que los separa y perdés el turno.</p><div class="dgrid">'+
  opts.map(id=>'<button class="btn" data-dx="'+id+'"><span class="t">'+EBY[id].n+'</span></button>').join('')+'</div><button class="btn" data-close><span class="t">Volver</span><span class="s">sin gastar turno</span></button>');
 $('ovbox').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>pickDx(b.dataset.dx));
}
async function pickDx(id){
 closeOv();const e=S.enemy,d=e.d;S.busy=true;
 if(id===d.id){
  const n=clues(e);e.diag=true;e.mult=multFor(n);Object.assign(e.rec.dx,{ok:true,n,mult:e.mult});reveal(e.rec);
  say('<b class="good">Diagnóstico confirmado.</b> '+d.clave+' = <b>'+d.n+'</b> · <i>'+d.cuadro+'</i>. Con '+n+' pista'+(n===1?'':'s')+', tus disparos pegan ×'+fmt(e.mult)+'.','dx');
  S.xp+=30+Math.round((e.mult-1.3)*100);
 }else{
  e.wrong.push(id);e.rec.dx.wrong.push(id);const why=d.diferenciales&&d.diferenciales[id];
  say('<b class="bad">No es '+EBY[id].n+'</b>'+(why?': '+why:'. Revisá las pistas.'),'dxbad');
 }
 render();await wait(700);await enemyTurn();
}
function giveHint(auto){
 const e=S.enemy;if(!e||e.hint)return;e.hint=true;
 const bid=Object.keys(e.d.best)[0],w=WBY[bid],tab=TABS.find(t=>t.id===w.tab);

/* ============ ACCIONES ============ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fire(w){
 const e=S.enemy;if(S.busy||!e||e.dying>=0)return;
 if(w.ammo&&S.ammo[w.id]<=0){say('<span class="bad">Sin '+w.n+' en la reserva de este piso.</span> Cada piso repone la farmacia.','warn');return}
 S.busy=true;render();
 if(w.ammo)S.ammo[w.id]--;
 S.recoil=1;S.shots.push({t0:performance.now(),col:TABC[w.tab]});
 await wait(280);
 const r=evalShot(w,e.d),d=e.d;let msg='<b>'+w.n+'.</b> ';
 e.rec.shots.push({w:w.id,t:r.t,txt:r.txt});
 if(r.t==='best'){const dmg=Math.round(55*e.mult);e.hp-=dmg;e.hitT=now();pop('-'+dmg,'#ffd166');msg+='<b class="good">¡Súper efectivo!</b> '+r.txt}
 else if(r.t==='ok'){const dmg=Math.round(28*e.mult);e.hp-=dmg;e.hitT=now();pop('-'+dmg,'#e8e3d6');msg+='Le pega, pero no es la primera elección. '+r.txt}
 else if(r.t==='res'){e.hp=Math.min(e.max,e.hp+12);e.shield=now();e.misses++;S.misfires++;pop('RESISTE','#ff5148');msg+='<b class="bad">¡Resiste y se cura!</b> '+r.txt;
   if(d.abHurt&&(w.cls||'ab')==='ab'){S.hp-=d.abHurt;S.hurtT=now();msg+=' <span class="bad">(−'+d.abHurt+' de salud)</span>'}}
 else {e.misses++;S.misfires++;pop('SIN EFECTO','#8f9c99');msg+='<b>Sin efecto.</b> '+r.txt}
 if(w.press&&r.t!=='best'){S.pressure+=w.press;msg+=' <span class="bad">Presión de selección +'+w.press+'%.</span>'}
 say(msg,r.t);
 if(S.pressure>=100&&!S.cdiffNext&&d.id!=='cdiff'){S.pressure=0;S.cdiffNext=true;say('<b class="bad">Presión de selección al máximo:</b> arrasaste la flora intestinal. Algo se mueve en el colon...','warn')}
 if(e.misses>=2&&!e.hint)giveHint(true);
 render();
 if(S.hp<=0){await wait(600);return gameOver()}
 if(e.hp<=0){await wait(400);return kill()}
 await wait(650);await enemyTurn();
}
// soft: el turno se gastó en una pista; el zombie avanza igual pero su ataque pega la mitad.
async function enemyTurn(soft){
 const e=S.enemy;if(!e||e.hp<=0){S.busy=false;render();return}
 e.dist=Math.max(0,e.dist-1);
 if(e.dist<=1){
  const a=e.d.atk[Math.floor(Math.random()*e.d.atk.length)];
  let dmg=(e.d.boss?10:6)+Math.floor(Math.random()*5);if(e.dist===0)dmg=Math.round(dmg*1.3);if(soft)dmg=Math.ceil(dmg/2);
  S.hp-=dmg;S.hurtT=now();
  const nuevo=!e.hc.vir.some(v=>v.n===a[0]);if(nuevo)e.hc.vir.push({n:a[0],t:a[1]});
  say('Te ataca con <b>'+a[0]+'</b>: '+a[1]+' <span class="bad">−'+dmg+'</span>'+(nuevo?' <span class="mute">(anotado en la historia clínica)</span>':''),'atk');
 } else say('Avanza arrastrando los pies. Está a '+(e.dist*3)+' metros.','info');
 render();
 if(S.hp<=0){await wait(500);return gameOver()}
 S.busy=false;render();
}
async function kill(){
 const e=S.enemy;e.dying=now();S.busy=true;e.rec.out='kill';reveal(e.rec);render();
 let gain=e.d.boss?300:100;if(e.diag)gain+=50;const clean=e.misses===0;if(clean){gain+=50;S.clean++}
 S.xp+=gain;S.kills++;saveLast();
 const rec=dex[e.d.id]||{k:0,dx:false};rec.k++;if(e.diag)rec.dx=true;rec.cs=rec.cs||[];if(!rec.cs.includes(e.d.ci))rec.cs.push(e.d.ci);dex[e.d.id]=rec;store.set('gz-dex',dex);
 await wait(1100);
 const heal=Math.min(15,100-S.hp);S.hp+=heal;
 showFicha(e.d,{gain,clean,heal,after:true});
}
