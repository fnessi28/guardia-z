<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Shooter por turnos para estudiar Microbiología: zombies-bacteria y hongos contra un arsenal de antibióticos.">
<meta property="og:title" content="Guardia Z">
<meta property="og:description" content="Estudiá microbiología jugando: cada paciente zombie es un bicho y tus armas son los antibióticos.">
<meta name="theme-color" content="#0d1113">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1113'/%3E%3Crect x='6' y='2' width='4' height='12' fill='%23e8e3d6'/%3E%3Crect x='7' y='0' width='2' height='3' fill='%23e8e3d6'/%3E%3Crect x='7' y='5' width='2' height='7' fill='%23ff5148'/%3E%3C/svg%3E">
<title>Guardia Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: pasillo en primera persona arriba, consola de guardia (diálogo + arsenal) abajo o a la derecha en desktop. Look único oscuro, deliberado. */
:root{
  --bg:#0d1113; --panel:#151b1e; --panel2:#1c2428; --line:#2c383d;
  --fg:#e8e3d6; --mute:#8f9c99; --accent:#ffb02e; --danger:#ff5148; --ok:#5ee38f;
  --gpos:#8b5cf6; --gneg:#ec4899;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){#app{grid-template-columns:1.35fr 1fr;align-items:start}}
.col{display:grid;gap:10px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--mute)}
.topbar b{color:var(--accent);font-weight:600}
.topbar .sp{flex:1}
.screen{position:relative;border:2px solid var(--line);background:#000;line-height:0}
canvas{width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;display:block}
.plate{position:absolute;left:10px;top:10px;line-height:1.2;background:rgba(10,14,16,.82);border:2px solid var(--line);padding:6px 10px 8px;min-width:min(240px,60%);max-width:70%}
.pname{font-family:var(--f-display);font-size:16px;letter-spacing:.03em}
.pname.unk{color:var(--mute)}
.bar{height:8px;background:#2a1517;margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--danger);transition:width .35s}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.chip{padding:1px 6px;border:1px solid var(--line);background:var(--panel)}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;background:var(--panel);border:2px solid var(--line);padding:10px 12px}
.hud label{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hud .val{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.hud .bar{height:10px;margin-top:4px}
#hpbar i{background:var(--ok)}
#prbar{background:#2a2412} #prbar i{background:var(--accent)}
.dialog{background:#0a0d0e;border:3px double var(--fg);padding:12px 14px;min-height:118px;display:grid;gap:8px;align-content:start}
.dialog p{margin:0;max-width:70ch}
.dialog p.old{color:var(--mute);font-size:13.5px}
.dialog b{color:var(--accent);font-weight:600}
.dialog .good{color:var(--ok)} .dialog .bad{color:var(--danger)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--panel2);border:2px solid var(--line);padding:10px 6px;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:grid;gap:2px;justify-items:center}
.act small{font-family:var(--f-body);font-size:11px;color:var(--mute);letter-spacing:0;text-transform:none}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.4;cursor:not-allowed}
.arsenal{background:var(--panel);border:2px solid var(--line)}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--line)}
.tab{flex:1 0 auto;background:none;border:0;padding:9px 10px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab .sq{width:8px;height:8px;display:inline-block}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--tc)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px}
.wpn{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;align-items:start}
.wpn:hover:not(:disabled){border-color:var(--tc)}
.wpn:disabled{opacity:.35;cursor:not-allowed}
.wpn .ic{grid-row:span 2;width:12px;height:22px;margin-top:3px;background:var(--tc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.35)}
.wpn .nm{font-weight:600;font-size:14px;line-height:1.2}
.wpn .mc{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.3}
.wpn .key{font-family:var(--f-display);font-size:11px;color:var(--mute)}
.wpn .am{font-family:var(--f-display);font-size:11px;color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(5,7,8,.86);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.box{background:var(--panel);border:3px double var(--fg);max-width:640px;width:100%;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 32px);overflow-y:auto}
.box h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.02em}
.box h3{font-family:var(--f-display);font-size:14px;margin:0;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,11vw,84px);line-height:.9;letter-spacing:.02em;color:var(--fg);text-shadow:4px 4px 0 #6b0f0f}
.logo span{color:var(--danger);text-shadow:4px 4px 0 #3a0606}
.lead{color:var(--mute);margin:0;max-width:56ch}
.btns{display:grid;gap:8px}
.btn{background:var(--panel2);border:2px solid var(--line);padding:11px 14px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.btn:hover{border-color:var(--accent)}
.btn.main{border-color:var(--accent);background:#2a2110}
.btn .t{font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.btn .s{font-size:12.5px;color:var(--mute);text-align:right}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.how{font-size:13.5px;color:var(--mute);display:grid;gap:4px;margin:0;padding-left:18px}
.how b{color:var(--fg);font-weight:600}
.ficha{display:grid;gap:10px}
.ficha dl{margin:0;display:grid;gap:9px}
.ficha dt{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ficha dd{margin:2px 0 0}
.ficha .trap{border:2px dashed var(--danger);padding:8px 10px}
.ficha .trap dt{color:var(--danger)}
.stainrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.dot{width:12px;height:12px;display:inline-block;border:1px solid rgba(255,255,255,.3)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bcard{background:var(--panel2);border:2px solid var(--line);padding:8px;text-align:left;display:grid;gap:3px;font-size:13px;line-height:1.25}
.bcard.unseen{color:var(--mute);cursor:default}
.bcard .bn{font-weight:600}
.bcard .bs{font-size:11px;color:var(--mute);font-family:var(--f-display);letter-spacing:.06em}
.dgrid{display:grid;gap:8px}
.statline{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-display);font-size:14px;letter-spacing:.04em}
.statline b{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:520px){.actions{grid-template-columns:repeat(2,1fr)}.plate{min-width:0;max-width:78%;padding:4px 8px 6px}.pname{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div class="topbar"><b id="floorLbl">Guardia Z</b><span id="roomLbl"></span><span class="sp"></span><span id="xpLbl">XP 0</span></div>
    <div class="screen">
      <canvas id="cv" width="320" height="180" aria-label="Pasillo del hospital con el paciente zombie"></canvas>
      <div class="plate" id="plate" hidden>
        <div class="pname unk" id="pname">???</div>
        <div class="bar"><i id="ehp" style="width:100%"></i></div>
        <div class="ptags" id="ptags"></div>
      </div>
    </div>
    <div class="hud">
      <div><label>Salud</label><div class="val" id="hpVal">100</div><div class="bar" id="hpbar"><i style="width:100%"></i></div></div>
      <div><label>Presión de selección</label><div class="val" id="prVal">0%</div><div class="bar" id="prbar"><i style="width:0%"></i></div></div>
      <div><label>Reserva hospitalaria</label><div class="val" id="ammoVal" style="font-size:14px;line-height:1.5"></div></div>
    </div>
    <div class="dialog" id="dlg" aria-live="polite"></div>
  </div>
  <div class="col">
    <div class="actions">
      <button class="act" id="bScan">Escanear<small>tinción y lab · S</small></button>
      <button class="act" id="bDiag">Diagnosticar<small>+40% daño · D</small></button>
      <button class="act" id="bHint">Pista<small>residente · P</small></button>
      <button class="act" id="bBest">Bestiario<small>tu colección · B</small></button>
    </div>
    <div class="arsenal">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="wgrid" id="wgrid"></div>
    </div>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="box" id="ovbox"></div></div>

<script>
/* ============ ARSENAL ============ */
const TABS=[
 {id:'pared',n:'Pared · membrana',c:'#f5c542'},
 {id:'ribo',n:'Ribosoma',c:'#4cc3f0'},
 {id:'adn',n:'ADN · folato',c:'#a6e04a'},
 {id:'hongo',n:'Antifúngicos',c:'#38d6c0'},
 {id:'sost',n:'Sin ATB',c:'#ff7a6b'}];
const W=[
 {id:'penG',n:'Penicilina G',tab:'pared',fam:'bl',mech:'Bloquea las PBP: no se arma el peptidoglicano, lisis'},
 {id:'amoxi',n:'Amoxicilina / Ampicilina',tab:'pared',fam:'bl',mech:'Aminopenicilina: entra mejor en algunos Gram −'},
 {id:'amoxiclav',n:'Amoxi-clavulánico',tab:'pared',fam:'bl',mech:'Amoxi + inhibidor de β-lactamasa',press:15},
 {id:'oxa',n:'Oxacilina',tab:'pared',fam:'bl',mech:'Resiste la penicilinasa del estafilococo'},
 {id:'cefa1',n:'Cefazolina / Cefalexina',tab:'pared',fam:'bl',mech:'Cefalosporina 1ª: sobre todo Gram +'},
 {id:'ceftri',n:'Ceftriaxona',tab:'pared',fam:'bl',mech:'Cefalosporina 3ª: Gram − y pasa la BHE',press:20},
 {id:'ceftaz',n:'Ceftazidima / Cefepime',tab:'pared',fam:'bl',mech:'Cefalosporina antipseudomónica',press:20},
 {id:'mero',n:'Meropenem',tab:'pared',fam:'bl',mech:'Carbapenem: resiste casi toda β-lactamasa',press:35,ammo:3},
 {id:'vanco',n:'Vancomicina',tab:'pared',fam:'gp',mech:'Se pega al D-Ala-D-Ala: frena la pared de Gram +',press:15,ammo:5},
 {id:'colis',n:'Colistina',tab:'pared',fam:'poli',mech:'Polimixina: desarma el LPS de la membrana externa',press:30,ammo:2},
 {id:'genta',n:'Gentamicina',tab:'ribo',fam:'amino',mech:'Aminoglucósido 30S: lectura errónea. Entra con O₂'},
 {id:'macro',n:'Azitro / Claritromicina',tab:'ribo',fam:'macro',mech:'Macrólido 50S: frena la translocación'},
 {id:'doxi',n:'Doxiciclina',tab:'ribo',fam:'tetra',mech:'Tetraciclina 30S: bloquea la entrada del ARNt'},
 {id:'clinda',n:'Clindamicina',tab:'ribo',fam:'linco',mech:'50S: además frena la síntesis de toxinas',press:25},
 {id:'cipro',n:'Cipro / Levofloxacina',tab:'adn',fam:'quino',mech:'Quinolona: inhibe ADN girasa y topoisomerasa IV',press:20},
 {id:'tmp',n:'TMP-SMX',tab:'adn',fam:'fol',mech:'Doble bloqueo de la síntesis de folato'},
 {id:'metro',n:'Metronidazol',tab:'adn',fam:'nitroimid',mech:'Se activa por reducción en anaerobios y rompe el ADN'},
 {id:'nitro',n:'Nitrofurantoína',tab:'adn',fam:'uri',mech:'Se concentra en orina: daña ADN y ribosomas'},
 {id:'ripe',n:'Esquema RIPE',tab:'adn',fam:'tb',mech:'Rifampicina · Isoniazida · Pirazinamida · Etambutol'},
 {id:'anfo',n:'Anfotericina B',tab:'hongo',cls:'af',mech:'Polieno: se une al ergosterol y hace poros'},
 {id:'fluco',n:'Fluconazol',tab:'hongo',cls:'af',mech:'Azol: frena la síntesis de ergosterol (14α-desmetilasa)'},
 {id:'itra',n:'Itraconazol',tab:'hongo',cls:'af',mech:'Azol de elección en dimórficos'},
 {id:'vori',n:'Voriconazol',tab:'hongo',cls:'af',mech:'Azol que cubre filamentosos'},
 {id:'equino',n:'Caspofungina',tab:'hongo',cls:'af',mech:'Equinocandina: bloquea el β-1,3-glucano de la pared'},
 {id:'terbi',n:'Terbinafina',tab:'hongo',cls:'af',mech:'Inhibe la escualeno epoxidasa; se acumula en queratina'},
 {id:'nista',n:'Nistatina',tab:'hongo',cls:'af',mech:'Polieno tópico: no se absorbe'},
 {id:'antitox',n:'Antitoxina / Inmunoglobulina',tab:'sost',cls:'sp',mech:'Neutraliza la toxina circulante (no la ya fijada)'},
 {id:'sosten',n:'Sostén sin ATB',tab:'sost',cls:'sp',mech:'Rehidratar, soporte, no tirar antibióticos'}];
const WBY=Object.fromEntries(W.map(w=>[w.id,w]));
const TABC=Object.fromEntries(TABS.map(t=>[t.id,t.c]));

/* ============ BESTIARIO ============ */
const MECA='Gen mecA: fabrica PBP2a, con baja afinidad por TODOS los betalactámicos.';
const CEF='Resistencia intrínseca a TODAS las cefalosporinas (PBP de baja afinidad).';
const CEFL='Resistencia intrínseca a cefalosporinas. Por eso en meningitis del neonato o del mayor de 50 se suma ampicilina.';
const PSEU='Resistencia intrínseca: porinas poco permeables, AmpC y bombas de eflujo.';
const KPC='Carbapenemasa KPC: hidroliza penicilinas, cefalosporinas y carbapenémicos.';
const CD='Más ATB de amplio espectro = más disbiosis = más C. difficile.';
const PJ='Pneumocystis NO tiene ergosterol en la membrana (usa colesterol): ni polienos ni azoles le hacen nada.';

const E=[
/* ---------- PISO 1: GRAM + ---------- */
{id:'saureus',n:'Staphylococcus aureus',f:1,stain:'pos',feats:['racimos','forunculo','escaldada'],
 epi:'Post-operado con la herida supurando y fiebre.',
 sint:'Cubierto de forúnculos amarillos en racimo; la piel se le despega a tiras.',
 lab:'Cocos Gram + en RACIMOS. Catalasa +, coagulasa +. Colonias doradas β-hemolíticas.',
 atk:[['Proteína A','se pega a la Fc de tu IgG: tus anticuerpos quedan al revés.'],['Toxina TSST-1','superantígeno: activa linfocitos T en masa, shock.'],['Exfoliatinas','cortan la desmogleína-1: piel escaldada.'],['Leucocidina PV','agujerea tus neutrófilos.']],
 best:{oxa:'Oxacilina resiste la penicilinasa: es EL arma contra el SAMS.',cefa1:'Cefazolina: elección en SAMS, sobre todo en profilaxis quirúrgica.'},
 ok:{clinda:'Clindamicina sirve en piel y partes blandas si es sensible.',tmp:'TMP-SMX: alternativa oral en piel.',amoxiclav:'El clavulánico frena la penicilinasa, pero es más amplio de lo necesario.',vanco:'Vancomicina mata, pero contra SAMS es INFERIOR a la oxacilina. Guardala para el SAMR.'},
 res:{penG:'Penicilinasa (blaZ): más del 90% de las cepas destruye la penicilina.',amoxi:'La amoxicilina sola también cae ante la penicilinasa.'},
 ficha:{m:'Coco Gram + en racimo, catalasa + y coagulasa +.',v:'Proteína A, coagulasa, TSST-1, exfoliatinas, enterotoxinas termoestables, leucocidina PV.',c:'Forúnculos, celulitis, osteomielitis, endocarditis (ADVP), shock tóxico, piel escaldada, intoxicación alimentaria.',t:'SAMS: oxacilina o cefazolina.',x:'La penicilina G casi nunca sirve: penicilinasa en más del 90%.'}},
{id:'spyo',n:'Streptococcus pyogenes',f:1,stain:'pos',feats:['cadena','lengua','erisipela'],
 epi:'Nene de 7 años con faringitis, fiebre y un rash áspero como papel de lija.',
 sint:'Lengua aframbuesada, una placa roja de borde neto en la pierna y cadenas de cocos colgando de los brazos.',
 lab:'Cocos Gram + en CADENA. Catalasa −. β-hemólisis completa. Sensible a bacitracina. Grupo A de Lancefield.',
 atk:[['Proteína M','antifagocítica; mimetiza miocardio: fiebre reumática.'],['Estreptolisina O','perfora membranas (genera ASTO).'],['Toxina eritrogénica','superantígeno de la escarlatina.'],['Estreptoquinasa','disuelve coágulos para diseminarse.']],
 best:{penG:'Penicilina: nunca se describió resistencia en S. pyogenes.',amoxi:'Amoxicilina 10 días: elección en faringitis, previene la fiebre reumática.'},
 ok:{cefa1:'Cefalosporina 1ª: sirve.',macro:'Macrólido: para alérgicos, pero hay resistencia creciente.',clinda:'Clindamicina: en fascitis se suma para frenar la síntesis de toxinas.'},
 ficha:{m:'Coco Gram + en cadena, β-hemolítico, grupo A, bacitracina sensible.',v:'Proteína M, cápsula de ácido hialurónico, estreptolisinas O y S, toxinas eritrogénicas, estreptoquinasa.',c:'Faringitis, escarlatina, impétigo, erisipela, fascitis necrotizante, shock tóxico. Secuelas: fiebre reumática y GNPE.',t:'Penicilina o amoxicilina.',x:'Erisipela: borde neto (dermis). Celulitis: borde difuso (dermis + TCS).'}},
{id:'spneu',n:'Streptococcus pneumoniae',f:1,stain:'pos',feats:['capsula','herrumbre','tos'],
 epi:'Hombre de 70 años: fiebre brusca con un único escalofrío y puntada de costado.',
 sint:'Escupe esputo color herrumbre y lo rodea un escudo brillante: la cápsula.',
 lab:'DIPLOCOCOS Gram + lanceolados. α-hemólisis. Sensible a optoquina, bilis soluble. Antígeno urinario +.',
 atk:[['Cápsula','polisacárido antifagocítico: tus macrófagos resbalan.'],['Neumolisina','perfora membranas y activa complemento.'],['Autolisina','se rompe a sí mismo y libera más neumolisina.'],['IgA proteasa','corta tu IgA de mucosas.']],
 best:{amoxi:'Amoxicilina en dosis altas: elección en NAC por neumococo.',ceftri:'Ceftriaxona: elección en meningitis o NAC grave (pasa la BHE).'},
 ok:{penG:'Penicilina: sirve si la CIM lo permite.',macro:'Macrólido: alternativa en alérgicos, con resistencia.',cipro:'Levofloxacina (quinolona respiratoria) cubre; la cipro no tanto.'},
 res:{genta:'Aminoglucósido solo: el neumococo es poco sensible, entra mal.'},
 ficha:{m:'Diplococo Gram + lanceolado, α-hemolítico, optoquina sensible.',v:'Cápsula (más de 90 serotipos), neumolisina, autolisina, IgA proteasa.',c:'NAC típica, otitis media, sinusitis, meningitis del adulto, bacteriemia en esplenectomizados.',t:'Amoxicilina (NAC); ceftriaxona ± vancomicina en meningitis.',x:'Su resistencia es por PBP alteradas, NO por β-lactamasa: el clavulánico no agrega nada.'}},
{id:'entero',n:'Enterococcus faecalis',f:1,stain:'pos',feats:['cadena','fuego'],
 epi:'Mujer de 75 años sondada, con ITU que no mejora con ceftriaxona.',
 sint:'Le arde todo por dentro y una cadena corta de cocos le cuelga de la panza.',
 lab:'Cocos Gram + en pares o cadenas cortas. Catalasa −. Crece en bilis-esculina y en NaCl 6,5%. PYR +.',
 atk:[['Resistencia intrínseca','se ríe de tus cefalosporinas.'],['Sustancia de agregación','se pega a las válvulas: endocarditis.'],['Biofilm','se atrinchera en la sonda.']],
 best:{amoxi:'Ampicilina/amoxicilina: elección en E. faecalis. En endocarditis, + gentamicina por sinergia.'},

/* ============ LÓGICA DE TIRO ============ */
const gramOf=e=>e.g||(e.stain==='pos'?'+':e.stain==='neg'?'-':null);
function generic(w,e){
 const cls=w.cls||'ab',g=gramOf(e),f=e.flags||{};
 if(e.kind==='hongo'&&cls==='ab') return 'Antibacteriano contra un hongo: es eucariota, sin peptidoglicano y con ribosoma 80S. No hay blanco.';
 if(e.kind!=='hongo'&&cls==='af') return 'Antifúngico contra una bacteria: no tiene ergosterol ni pared de glucanos. No hay blanco.';
 if(w.id==='antitox') return 'No hay una toxina para neutralizar con antitoxina en este bicho.';
 if(w.id==='sosten') return 'Con sostén solo no alcanza: este necesita tratamiento específico.';
 if(e.kind==='hongo') return w.n+' no es la opción indicada para este hongo.';
 if(f.myco) return 'Pared llena de ácidos micólicos: casi impermeable. Las micobacterias necesitan un esquema combinado y largo.';
 if((w.fam==='bl'||w.id==='vanco')&&f.sinPared) return 'No tiene pared de peptidoglicano: no hay nada que romper.';
 if(w.fam==='bl'&&f.intracel) return 'Vive dentro de las células: el betalactámico casi no penetra y no lo alcanza.';
 if(w.id==='vanco'&&g==='-') return 'La vancomicina es una molécula enorme: no atraviesa la membrana externa de los Gram −.';
 if(w.id==='genta'&&f.anaerobio) return 'Los aminoglucósidos entran por un transporte que depende de O₂: en un anaerobio no entran.';
 if(w.id==='metro'&&!f.anaerobio) return 'El metronidazol necesita reducirse en ambiente anaerobio para activarse: acá no se activa.';
 if(w.id==='colis'&&g!=='-') return 'La colistina ataca el LPS de la membrana externa: este bicho no tiene.';
 if(w.id==='nitro') return 'La nitrofurantoína solo concentra en orina: sirve para cistitis y nada más.';
 if(w.id==='ripe') return 'El esquema RIPE es para micobacterias: acá es munición pesada al voleo.';
 if((w.id==='oxa'||w.id==='cefa1'||w.id==='penG')&&g==='-') return w.n+' tiene espectro de Gram +: no atraviesa bien las porinas de este Gram −.';
 return w.n+' no es una opción indicada para este bicho: le hace cosquillas.';
}
function evalShot(w,e){
 if(e.best&&e.best[w.id]) return {t:'best',txt:e.best[w.id]};
 if(e.ok&&e.ok[w.id]) return {t:'ok',txt:e.ok[w.id]};
 if(e.res&&e.res[w.id]) return {t:'res',txt:e.res[w.id]};
 if(e.nul&&e.nul[w.id]) return {t:'nul',txt:e.nul[w.id]};
 if(e.allAb&&(w.cls||'ab')==='ab') return {t:'res',txt:e.allAb};
 return {t:'nul',txt:generic(w,e)};
}

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let dex=store.get('gz-dex',{});
const S={mode:null,floor:1,queue:[],room:0,rooms:0,hp:100,pressure:0,xp:0,ammo:{},enemy:null,busy:false,tab:'pared',log:[],kills:0,clean:0,misfires:0,cdiffNext:false,hurtT:-9,recoil:0,shots:[],floats:[],started:false};
function resetAmmo(){W.forEach(w=>{if(w.ammo)S.ammo[w.id]=w.ammo})}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildFloor(f){
 if(f===0){const pool=shuffle(E.filter(e=>!e.boss));const boss=shuffle(E.filter(e=>e.boss))[0];return pool.slice(0,6).map(e=>e.id).concat(boss.id)}
 const pool=shuffle(E.filter(e=>e.f===f&&!e.boss));const boss=E.find(e=>e.f===f&&e.boss);
 return pool.slice(0,6).map(e=>e.id).concat(boss.id);
}
function startRun(mode,floor){
 S.mode=mode;S.floor=mode==='camp'?1:floor;S.hp=100;S.pressure=0;S.xp=0;S.kills=0;S.clean=0;S.misfires=0;S.cdiffNext=false;resetAmmo();
 S.log=[];S.started=true;startFloor();closeOv();
}
function startFloor(){S.queue=buildFloor(S.floor);S.rooms=S.queue.length;S.room=0;resetAmmo();nextEnemy();}
function nextEnemy(){
 let id;
 if(S.cdiffNext){id='cdiff';S.cdiffNext=false;S.rooms++}
 else id=S.queue.shift();
 if(!id){floorClear();return}
 S.room++;
 const d=EBY[id];
 const hp=d.boss?150:100;
 S.enemy={d,hp,max:hp,dist:3,disp:0.12,scanned:false,diag:false,mult:1,misses:0,hint:false,wrong:[],dying:-1,flash:-9,shield:-9,hitT:-9};
 S.log=[];
 say('<b>'+(d.boss?'¡JEFE DE PISO! ':'¡Un paciente se transformó! ')+'</b>'+d.epi);

 S.busy=false;render();
}
function say(html){S.log.push(html);if(S.log.length>3)S.log.shift();renderLog()}
function renderLog(){$('dlg').innerHTML=S.log.map((h,i)=>'<p'+(i<S.log.length-1&&S.log.length>2&&i===0?' class="old"':'')+'>'+h+'</p>').join('')}

/* ============ ACCIONES ============ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fire(w){
 const e=S.enemy;if(S.busy||!e||e.dying>=0)return;
 if(w.ammo&&S.ammo[w.id]<=0){say('<span class="bad">Sin '+w.n+' en la reserva de este piso.</span> Cada piso repone la farmacia.');return}
 S.busy=true;render();
 if(w.ammo)S.ammo[w.id]--;
 S.recoil=1;S.shots.push({t0:performance.now(),col:TABC[w.tab]});
 await wait(280);
 const r=evalShot(w,e.d),d=e.d;let msg='';
 if(r.t==='best'){const dmg=Math.round(55*e.mult);e.hp-=dmg;e.hitT=now();pop('-'+dmg,'#ffd166');msg='<b class="good">¡SÚPER EFECTIVO!</b> '+r.txt}
 else if(r.t==='ok'){const dmg=Math.round(28*e.mult);e.hp-=dmg;e.hitT=now();pop('-'+dmg,'#e8e3d6');msg='<b>Le pega.</b> Sirve, pero no es la primera elección. '+r.txt}
 else if(r.t==='res'){e.hp=Math.min(e.max,e.hp+12);e.shield=now();e.misses++;S.misfires++;pop('RESISTE','#ff5148');msg='<b class="bad">¡RESISTE!</b> '+r.txt;
   if(d.abHurt&&(w.cls||'ab')==='ab'){S.hp-=d.abHurt;S.hurtT=now();msg+=' <span class="bad">(−'+d.abHurt+' de salud)</span>'}}
 else {e.misses++;S.misfires++;pop('SIN EFECTO','#8f9c99');msg='<b>Sin efecto.</b> '+r.txt}
 if(w.press&&r.t!=='best'){S.pressure+=w.press;msg+=' <span class="bad">Presión de selección +'+w.press+'%.</span>'}
 say(msg);
 if(S.pressure>=100&&!S.cdiffNext&&d.id!=='cdiff'){S.pressure=0;S.cdiffNext=true;say('<b class="bad">Presión de selección al máximo:</b> arrasaste la flora intestinal. Algo se mueve en el colon...')}
 if(e.misses>=2&&!e.hint)giveHint(true);
 render();
 if(S.hp<=0){await wait(600);return gameOver()}
 if(e.hp<=0){await wait(400);return kill()}
 await wait(650);await enemyTurn();
}
async function scan(){
 const e=S.enemy;if(S.busy||!e||e.dying>=0)return;
 if(e.scanned){say('<b>Escáner:</b> '+e.d.lab);return}
 S.busy=true;e.scanned=true;render();
 say('<b>Escáner · '+STAIN[e.d.stain][0]+':</b> '+e.d.lab);
 await wait(700);await enemyTurn();
}
function diagnose(){
 const e=S.enemy;if(S.busy||!e||e.dying>=0||e.diag)return;
 const same=E.filter(x=>x.id!==e.d.id&&(x.kind||'bac')===(e.d.kind||'bac')&&!e.wrong.includes(x.id));
 const opts=shuffle([e.d,...shuffle(same).slice(0,3)]);
 openOv('<h3>Diagnosticar</h3><h2>¿Qué bicho es?</h2><p class="lead">Si acertás, tus disparos pegan 40% más fuerte y queda registrado en el bestiario. Si errás, te come un turno.</p><div class="dgrid">'+
  opts.map(o=>'<button class="btn" data-dx="'+o.id+'"><span class="t">'+o.n+'</span></button>').join('')+'</div><button class="btn" data-close><span class="t">Volver</span><span class="s">sin gastar turno</span></button>');
 $('ovbox').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>pickDx(b.dataset.dx));
}
async function pickDx(id){
 closeOv();const e=S.enemy;S.busy=true;
 if(id===e.d.id){e.diag=true;e.mult=1.4;say('<b class="good">Diagnóstico confirmado:</b> '+e.d.n+'. Tus disparos ahora pegan 40% más fuerte.');S.xp+=30}
 else{e.wrong.push(id);say('<b class="bad">Diagnóstico errado:</b> no es '+EBY[id].n+'. Revisá las pistas.')}

function giveHint(auto){
 const e=S.enemy;if(!e||e.hint)return;e.hint=true;
 const bid=Object.keys(e.d.best)[0],w=WBY[bid],tab=TABS.find(t=>t.id===w.tab);
 say('<b>Residente:</b> '+(auto?'«Pará de tirar al voleo. ':'«')+'Fijate en la pestaña <b>'+tab.n+'</b>.»');
 render();
}
async function enemyTurn(){
 const e=S.enemy;if(!e||e.hp<=0){S.busy=false;render();return}
 e.dist=Math.max(0,e.dist-1);
 if(e.dist<=1){
  const a=e.d.atk[Math.floor(Math.random()*e.d.atk.length)];
  let dmg=(e.d.boss?10:6)+Math.floor(Math.random()*5);if(e.dist===0)dmg=Math.round(dmg*1.3);
  S.hp-=dmg;S.hurtT=now();
  say('<span class="bad">Te ataca con <b>'+a[0]+'</b>: '+a[1]+' −'+dmg+'</span>');
 } else say('Avanza arrastrando los pies. Está a '+(e.dist*3)+' metros.');
 render();
 if(S.hp<=0){await wait(500);return gameOver()}
 S.busy=false;render();
}
async function kill(){
 const e=S.enemy;e.dying=now();S.busy=true;render();
 let gain=e.d.boss?300:100;if(e.diag)gain+=50;const clean=e.misses===0;if(clean){gain+=50;S.clean++}
 S.xp+=gain;S.kills++;
 const rec=dex[e.d.id]||{k:0,dx:false};rec.k++;if(e.diag)rec.dx=true;dex[e.d.id]=rec;store.set('gz-dex',dex);
 await wait(1100);
 const heal=Math.min(15,100-S.hp);S.hp+=heal;
 showFicha(e.d,{gain,clean,heal,after:true});
}
function floorClear(){
 S.busy=true;const heal=Math.min(40,100-S.hp);S.hp+=heal;S.enemy=null;render();

  $('goOn').onclick=()=>{closeOv();S.floor++;startFloor()};return}
 openOv('<h3>Turno terminado</h3><h2>'+(S.mode==='camp'?'Sobreviviste a la guardia completa':'Piso despejado')+'</h2><div class="statline"><span>XP <b>'+S.xp+'</b></span><span>Bajas <b>'+S.kills+'</b></span><span>Tiros limpios <b>'+S.clean+'</b></span><span>Disparos errados <b>'+S.misfires+'</b></span></div><p class="lead">Récord: '+Math.max(best,S.xp)+' XP. Mirá el bestiario para repasar las fichas que juntaste.</p><button class="btn main" id="goMenu"><span class="t">Volver al menú</span></button>');
 $('goMenu').onclick=menu;
}

 if(F.has('pseudohifa')){c.strokeStyle='#e8e6da';c.lineWidth=1;hands.forEach(([hx,hy2],i)=>{const sg=i?1:-1;c.beginPath();c.moveTo(hx,hy2);for(let s=1;s<5;s++)c.lineTo(hx+sg*s*3,hy2-s*2+(s%2)*2);c.stroke();for(let s=1;s<5;s++)circ(hx+sg*s*3,hy2-s*2+(s%2)*2,1,'#e8e6da')})}
 if(F.has('cateter')){c.strokeStyle='#d6e4ea';c.lineWidth=1;c.beginPath();c.moveTo(hands[0][0],hands[0][1]);c.quadraticCurveTo(-48,-90,-40,-110);c.stroke();c.fillStyle='rgba(200,230,240,.7)';c.fillRect(-46,-124,12,14)}
 if(F.has('moho')){const mc=d.mohoC||'#7fae6a';c.strokeStyle=mc;c.lineWidth=1.1;for(let j=0;j<12;j++){const a=-Math.PI*0.95+j/11*Math.PI*0.9,len=8+(j%3)*4+Math.sin(t/300+j)*1.5,bx=Math.cos(a)*11,by=hy+Math.sin(a)*11;c.beginPath();c.moveTo(bx,by);c.lineTo(bx+Math.cos(a)*len,by+Math.sin(a)*len);c.stroke();circ(bx+Math.cos(a)*len,by+Math.sin(a)*len,1.6,mc)}}
 if(F.has('bola')){circ(4,-66,6,'#5b7d4a');c.strokeStyle='#9cc58a';c.lineWidth=0.7;for(let j=0;j<8;j++){const a=j/8*7;c.beginPath();c.moveTo(4+Math.cos(a)*6,-66+Math.sin(a)*6);c.lineTo(4+Math.cos(a)*8,-66+Math.sin(a)*8);c.stroke()}}
 if(F.has('vidrio')){c.fillStyle='rgba(235,245,255,.45)';for(let j=0;j<10;j++)c.fillRect(-12+(j%5)*5,-76+Math.floor(j/5)*9,3,4)}
 if(F.has('anillo')){[[-8,-70],[8,-56],[-26,-68]].forEach(([px,py])=>{c.strokeStyle='#d6372e';c.lineWidth=1.6;c.beginPath();c.arc(px,py,4,0,7);c.stroke()})}
 if(F.has('nodulos')){for(let j=0;j<5;j++){const f=j/5,px=hands[0][0]*(1-f)+(-15)*f,py=hands[0][1]*(1-f)+(-78)*f;circ(px,py,1.9,'#b33a2c')}}
 if(F.has('escara')){c.fillStyle='#0c0c0c';c.beginPath();c.arc(0,hy,12,-1.2,1.6);c.fill();c.fillStyle='#3a1414';c.fillRect(4,hy+1,3,2)}
 if(F.has('cometa')){hands.forEach(([hx,hy2],i)=>{const sg=i?1:-1,L=(t/4)%20;c.strokeStyle='rgba(255,200,120,.8)';c.lineWidth=1;c.beginPath();c.moveTo(hx,hy2);c.lineTo(hx+sg*(6+L),hy2-2);c.stroke();circ(hx+sg*(6+L),hy2-2,1.5,'#ffe08a')})}
 // accesorios
 if(F.has('queso')){poly([hands[1][0]-2,hands[1][1]-6,hands[1][0]+9,hands[1][1]-2,hands[1][0]-2,hands[1][1]+3],'#f2c94c')}
 if(F.has('rosa')){c.strokeStyle='#2f7a3a';c.lineWidth=1;c.beginPath();c.moveTo(hands[1][0],hands[1][1]);c.lineTo(hands[1][0]+3,hands[1][1]-12);c.stroke();circ(hands[1][0]+3,hands[1][1]-13,2.6,'#d61f45')}
 if(F.has('frasco')){c.fillStyle='rgba(200,60,40,.85)';c.fillRect(hands[1][0]-3,hands[1][1]-1,7,9);c.fillStyle='#bbb';c.fillRect(hands[1][0]-3,hands[1][1]-3,7,2)}
 if(F.has('tabaco')){c.fillStyle='#efe6d0';c.fillRect(5,hy+5,7,1.6);c.fillStyle='#ff6a00';c.fillRect(12,hy+5,1.4,1.6);c.fillStyle='rgba(200,200,200,.5)';c.beginPath();c.arc(14+Math.sin(t/200)*2,hy-((t/40)%10),1.6,0,7);c.fill()}
 if(F.has('blando')){c.globalAlpha=1}
 if(F.has('boss')){c.fillStyle='#7a1b1b';for(let j=-2;j<=2;j++){poly([j*5-2,hy-10,j*5,hy-18-Math.abs(j)*-1,j*5+2,hy-10],'#7a1b1b')}}
 c.restore();
 // fauna
 if(F.has('rata')){const rx=24+Math.sin(t/400)*6;c.fillStyle='#6b6b6b';c.beginPath();c.ellipse(rx,-2,5,2.5,0,0,7);c.fill();c.fillRect(rx+4,-4,2,2);c.strokeStyle='#8a7070';c.lineWidth=0.6;c.beginPath();c.moveTo(rx-5,-2);c.lineTo(rx-10,-4);c.stroke()}
 if(F.has('paloma')){const px=-26,py=-3+Math.abs(Math.sin(t/180))*-2;c.fillStyle='#9aa0a8';c.beginPath();c.ellipse(px,py,5,3,0,0,7);c.fill();circ(px-4,py-3,2,'#8b929b');c.fillStyle='#f59e0b';c.fillRect(px-7,py-3,2,1)}
 if(F.has('gato')){const px=26;c.fillStyle='#d58a3a';c.fillRect(px-4,-6,9,5);circ(px+5,-7,2.6,'#d58a3a');poly([px+3,-9,px+4,-12,px+5,-9],'#d58a3a');poly([px+6,-9,px+7,-12,px+8,-9],'#d58a3a')}
 if(F.has('murcielago')){for(let j=0;j<3;j++){const a=t/500+j*2.1,bx=Math.cos(a)*24,by=-104+Math.sin(a*1.3)*8,fl=Math.sin(t/60+j)*2;c.fillStyle='#111';c.beginPath();c.moveTo(bx-5,by-fl);c.lineTo(bx,by+1);c.lineTo(bx+5,by-fl);c.lineTo(bx,by-1);c.fill()}}
 // escudo de resistencia
 const sh=now()-e.shield;if(sh<600){c.strokeStyle='rgba(120,255,160,'+(1-sh/600)+')';c.lineWidth=3;c.beginPath();c.ellipse(0,-58,40+sh/30,70+sh/30,0,0,7);c.stroke()}
 c.restore();
}
function drawGun(t){
 const tab=TABS.find(x=>x.id===S.tab),rc=S.recoil*8,bob=Math.sin(t/400)*1.2;
 c.save();c.translate(0,rc+bob);
 // guantes de nitrilo
 poly([118,180,140,150,150,152,140,180],'#5aa9d6');poly([202,180,180,150,170,152,180,180],'#4f9cc8');

 poly([146,180,174,180,169,128,151,128],'#d9e2e4');
 c.fillStyle=tab.c;c.fillRect(153,134,14,36);
 c.fillStyle='rgba(255,255,255,.35)';c.fillRect(154,134,2,36);
 c.fillStyle='#3c4a4e';for(let i=0;i<5;i++)c.fillRect(151,136+i*7,4,1);
 c.fillStyle='#9aa7ab';c.fillRect(150,126,20,3);
 c.fillStyle='#c8cfd2';c.fillRect(159,112,2,14);

 S.recoil*=0.85;
}
let last=now();
function frame(t){
 c.clearRect(0,0,320,180);
 drawCorridor(t);
 const e=S.enemy;
 if(e){
  const target=[1.0,0.76,0.55,0.38][e.dist];e.disp+=(target-e.disp)*0.06;
  let s=e.disp*(e.d.boss?1.15:1);
  const x=160+Math.sin(t/900)*7*e.disp,fy=96+72*e.disp;
  const hit=now()-e.hitT;const shake=hit<200?Math.sin(hit/12)*3:0;

   c.fillStyle='rgba(90,160,60,'+Math.min(0.7,dt)+')';c.beginPath();c.ellipse(x,fy,40*s*Math.min(1,dt*2),6*s,0,0,7);c.fill()}
  else drawZombie(e,x+shake,fy,s*1.18,t);
  // disparos
  S.shots=S.shots.filter(sh=>{const p=(now()-sh.t0)/260;if(p>1.2)return false;const pp=Math.min(1,p);const tx=x,ty=fy-70*s;const px=160+(tx-160)*pp,py=112+(ty-112)*pp;
   c.fillStyle=sh.col;c.beginPath();c.arc(px,py,3*(1-pp*0.5),0,7);c.fill();c.globalAlpha=0.4;c.beginPath();c.arc(160+(tx-160)*pp*0.8,112+(ty-112)*pp*0.8,2,0,7);c.fill();c.globalAlpha=1;
   if(p>1){c.fillStyle='rgba(255,255,255,'+(1.2-p)*4+')';c.beginPath();c.arc(tx,ty,10,0,7);c.fill()}return true});
  S.floats=S.floats.filter(f=>{const p=(now()-f.t0)/1100;if(p>1)return false;c.font='bold 12px "Pixelify Sans",monospace';c.textAlign='center';c.fillStyle='#000';c.fillText(f.txt,x+1,fy-110*s-p*16+1);c.fillStyle=f.col;c.globalAlpha=1-p;c.fillText(f.txt,x,fy-110*s-p*16);c.globalAlpha=1;return true});
 }
 drawGun(t);
 // daño recibido y alarma
 const ht=now()-S.hurtT;if(ht<350){c.fillStyle='rgba(200,0,0,'+(0.4*(1-ht/350))+')';c.fillRect(0,0,320,180)}
 if(S.started&&S.hp<30&&S.hp>0){c.fillStyle='rgba(180,0,0,'+(0.08+0.06*Math.sin(t/200))+')';c.fillRect(0,0,320,180)}
 // scanlines + viñeta
 c.fillStyle='rgba(0,0,0,.13)';for(let y=0;y<180;y+=2)c.fillRect(0,y,320,1);
 const g=c.createRadialGradient(160,90,60,160,90,200);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=g;c.fillRect(0,0,320,180);
 requestAnimationFrame(frame);
}
